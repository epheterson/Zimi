<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Rush - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="roadrush.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Road Rush</h1>
  <button class="ar-btn" id="rr-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="rr-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="roadrush.speed">Speed</small><b id="rr-speed">0</b></div>
    <div class="pl-stat"><small data-t="play.time">Time</small><b id="rr-time">50</b></div>
    <div class="pl-stat"><small data-t="play.score">Score</small><b id="rr-score">0</b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="rr-best">0</b></div>
  </div>
  <canvas class="pl-arena" id="rr-board" role="img" aria-label="The road ahead from behind your car, with traffic and roadside trees" data-t-aria="roadrush.board"></canvas>
  <p class="pl-msg" id="rr-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="roadrush.js"></script>
<script src="roadrush-art.js"></script>
<script src="roadrush-page.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q860750">About Road Rush</a></footer><!-- /zimi-about -->
</body>
</html>
