<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinball - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="pinball.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Pinball</h1>
  <button class="ar-btn" id="pb-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="pb-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="play.score">Score</small><b id="pb-score">0</b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="pb-best">0</b></div>
    <div class="pl-stat"><small data-t="pinball.balls">Balls</small><b id="pb-balls">3</b></div>
    <div class="pl-stat"><small data-t="pinball.bonus">Bonus</small><b id="pb-mult">&times;1</b></div>
  </div>
  <canvas class="pl-arena" id="pb-board" role="img" aria-label="The pinball table: plunger lane on the right, three bumpers, two flippers at the bottom" data-t-aria="pinball.board"></canvas>
  <p class="pl-msg" id="pb-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="pinball.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q653928">About Pinball</a></footer><!-- /zimi-about -->
</body>
</html>
