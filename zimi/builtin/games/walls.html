<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walls - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="boardui.css">
<link rel="stylesheet" href="world.css">
<link rel="stylesheet" href="walls.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" data-t-aria="shell.back" aria-label="Back">&lsaquo;</a>
  <h1>Walls</h1>
  <button class="ar-btn" id="wk-undo" type="button" disabled data-t="board.undo">Undo</button>
  <button class="ar-btn" id="wk-new" type="button" aria-haspopup="dialog" data-t="shell.menu.new">New game</button>
</header>

<main class="bg-main">
  <p class="bg-status" id="wk-status"></p>
  <div class="bg-score" id="wk-score" data-t-aria="walls.left" aria-label="Walls left"></div>
  <div class="wl-wrap" id="wl-wrap">
    <div class="wl-board" id="wl-board" data-t-aria="walls.board" aria-label="Walls board"></div>
    <div class="wl-junc" id="wl-junc" hidden></div>
  </div>
  <div class="bg-controls">
    <button class="ar-btn" id="wk-hint" type="button" disabled data-t="board.hint">Hint</button>
    <button class="ar-btn" id="wl-wallmode" type="button" aria-pressed="false" data-t="walls.wall">Wall</button>
    <button class="ar-btn" id="wl-turn" type="button" disabled data-t="walls.turn">Turn</button>
    <button class="ar-btn gs-primary" id="wl-place" type="button" disabled data-t="walls.place">Place</button>
  </div>
  <p class="bg-stats" id="wk-stats"></p>
</main>
<script src="util.js"></script>
<script src="boardkit.js"></script>
<script src="boardui.js"></script>
<script src="worldkit.js"></script>
<script src="enginekit.js"></script>
<script src="walls-engine.js"></script>

</html>
