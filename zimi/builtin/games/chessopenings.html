<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opening Trainer - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="boardui.css">
<link rel="stylesheet" href="chess.css">
<link rel="stylesheet" href="chesspuzzles.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" data-t-aria="shell.back" aria-label="Back">&lsaquo;</a>
  <h1>Opening Trainer</h1>
  <button class="ar-btn" id="co-new" type="button" aria-haspopup="dialog" data-t="shell.menu.new">New game</button>
</header>

<main class="bg-main is-rail">
  <p class="co-name" id="co-name" dir="auto"></p>
  <div class="bg-board cs-board cp-board" id="co-board" role="group" data-t-aria="chess.board" aria-label="Chess board"></div>
  <p class="bg-status" id="co-status"></p>
  <div class="bg-controls">
    <button class="ar-btn" id="co-hint" type="button" data-t="board.hint" data-t-title="openings.hintTitle" title="Show the book move (H)">Hint</button>
    <button class="ar-btn" id="co-restart" type="button" data-t="openings.restart">Restart</button>
    <button class="ar-btn" id="co-next" type="button" aria-pressed="true" data-t="openings.next" data-t-title="openings.nextTitle" title="Another line from the same family (N)">Next line</button>
  </div>
  <div class="cs-moves" id="co-moves" dir="ltr" role="log" data-t-aria="openings.theLine" aria-label="The line"></div>
  <p class="bg-stats" id="co-stats"></p>
</main>

<script src="util.js"></script>
<script src="boardkit.js"></script>
<script src="boardui.js"></script>
<script src="chess-pieces.js"></script>
<script src="chess-engine.js"></script>
<script src="chess-content.js"></script>
<script src="chess-board.js"></script>
<script src="data/chess-openings.js"></script>
<script src="chessopenings.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q103632">About Opening Trainer</a></footer><!-- /zimi-about -->
</body>
</html>
