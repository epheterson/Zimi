<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Line - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Last Line</h1>
  <button class="ar-btn" id="ll-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="ll-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="play.score">Score</small><b id="ll-score">0</b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="ll-best">0</b></div>
    <div class="pl-stat"><small data-t="play.lives">Lives</small><b id="ll-lives">3</b></div>
    <div class="pl-stat"><small data-t="play.wave">Wave</small><b id="ll-wave">1</b></div>
  </div>
  <canvas class="pl-arena" id="ll-board" role="img" aria-label="Rows of drones above your shields and cannon" data-t-aria="lastline.board"></canvas>
  <p class="pl-msg" id="ll-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="burstkit.js"></script>
<script src="lastline.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q220665">About Last Line</a></footer><!-- /zimi-about -->
</body>
</html>
