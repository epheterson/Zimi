<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muncher - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="pixel.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Muncher</h1>
  <button class="ar-btn" id="mn-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="mn-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="play.score">Score</small><b id="mn-score">0</b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="mn-best">0</b></div>
    <div class="pl-stat"><small data-t="play.lives">Lives</small><b id="mn-lives">3</b></div>
    <div class="pl-stat"><small data-t="muncher.maze.label">Maze</small><b id="mn-level">1</b></div>
  </div>
  <canvas class="px-screen" id="mn-screen" role="img" aria-label="The maze: your round muncher, dots, power pellets and four chasers" data-t-aria="muncher.screen"></canvas>
  <p class="pl-msg" id="mn-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="pixelkit.js"></script>
<script src="gridwalk.js"></script>
<script src="muncher.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q13717398">About Muncher</a></footer><!-- /zimi-about -->
</body>
</html>
