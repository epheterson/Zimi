<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stacker - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="stacker.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Stacker</h1>
  <button class="ar-btn" id="st-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="st-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="play.score">Score</small><b id="st-score">0</b></div>
    <div class="pl-stat"><small data-t="stacker.rows">Rows</small><b id="st-lines">0</b></div>
    <div class="pl-stat"><small data-t="play.level">Level</small><b id="st-level">1</b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="st-best">0</b></div>
  </div>
  <div class="st-wrap" id="st-wrap">
    <canvas class="pl-canvas" id="st-board" aria-label="The well" data-t-aria="stacker.well" role="img"></canvas>
    <aside class="st-side">
      <button class="st-box" id="st-holdbox" type="button" aria-label="Hold piece" data-t-aria="stacker.holdPiece"><small data-t="play.hold">Hold</small><canvas id="st-hold" aria-hidden="true"></canvas></button>
      <div class="st-box"><small data-t="stacker.next">Next</small><canvas id="st-next" aria-label="Next pieces" data-t-aria="stacker.nextPieces" role="img"></canvas></div>
    </aside>
  </div>
  <p class="pl-msg" id="st-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="stacker.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q71910">About Stacker</a></footer><!-- /zimi-about -->
</body>
</html>
