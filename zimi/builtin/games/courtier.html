<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtier - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="courtier.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" data-t-aria="shell.back" aria-label="Back">&lsaquo;</a>
  <h1 data-t="game.courtier.title">Courtier</h1>
  <button class="ar-btn" id="cr-new" type="button" data-t="shell.menu.new">New game</button>
</header>

<main class="pl-main cr-main">
  <p class="pl-msg" id="cr-msg" role="status" aria-live="polite"></p>
  <div id="cr-table" class="cr-tablearea">
    <div class="cr-seats" id="cr-seats" role="list" data-t-aria="courtier.seats.aria" aria-label="The court"></div>
    <p class="cr-deck" id="cr-deck"></p>
    <p class="cr-log" id="cr-log" aria-live="polite"></p>
  </div>
  <div class="cr-hand" id="cr-hand" role="group" data-t-aria="courtier.hand.aria" aria-label="Your hand"></div>
  <div class="gs-actionrow cr-actions">
    <button class="ar-btn gs-primary" id="cr-play" type="button" data-t="courtier.play">Play</button>
    <button class="ar-btn" id="cr-guide" type="button" data-t="courtier.guide">Cards</button>
  </div>
</main>

<div class="ar-sheet" id="cr-guess" hidden role="dialog" aria-modal="true" aria-labelledby="cr-guess-title">
  <div class="ar-sheet-card">
    <h2 id="cr-guess-title" data-t="courtier.guess.title">Name a card</h2>
    <p id="cr-guess-text"></p>
    <div class="cr-ranks" id="cr-ranks"></div>
    <div class="ar-sheet-actions"><button class="ar-btn" id="cr-guess-cancel" type="button" data-t="shell.cancel">Cancel</button></div>
  </div>
</div>

<div class="ar-sheet" id="cr-peek" hidden role="dialog" aria-modal="true" aria-labelledby="cr-peek-title">
  <div class="ar-sheet-card">
    <h2 id="cr-peek-title" data-t="courtier.peek.title">You looked</h2>
    <p id="cr-peek-text"></p>
    <div class="cr-peekcard" id="cr-peekcard"></div>
    <div class="ar-sheet-actions"><button class="ar-btn gs-primary" id="cr-peek-ok" type="button" data-t="shell.close">Close</button></div>
  </div>
</div>

<div class="ar-sheet" id="cr-round" hidden role="dialog" aria-modal="true" aria-labelledby="cr-round-title">
  <div class="ar-sheet-card">
    <h2 id="cr-round-title"></h2>
    <p id="cr-round-text"></p>
    <div class="cr-reveal" id="cr-reveal"></div>
    <div class="ar-sheet-actions"><button class="ar-btn gs-primary" id="cr-round-next" type="button" data-t="courtier.nextRound">Next round</button></div>
  </div>
</div>

<div class="ar-sheet" id="cr-cards" hidden role="dialog" aria-modal="true" aria-labelledby="cr-cards-title">
  <div class="ar-sheet-card">
    <h2 id="cr-cards-title" data-t="courtier.guide.title">The court</h2>
    <ul class="cr-list" id="cr-list"></ul>
    <div class="ar-sheet-actions"><button class="ar-btn gs-primary" id="cr-cards-close" type="button" data-t="shell.close">Close</button></div>
  </div>
</div>

<div class="ar-sheet" id="cr-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cr-sheet-title">
  <div class="ar-sheet-card">
    <h2 id="cr-sheet-title" data-t="game.courtier.title">Courtier</h2>
    <p id="cr-sheet-text" data-t="courtier.intro">Hold one card, draw one, play one. Be the last in the court, or hold the highest card when the deck runs out.</p>
    <p class="pl-row"><span id="cr-n-label" data-t="seats.players">Players</span><span class="pl-seg" id="cr-n" role="group" aria-labelledby="cr-n-label"></span></p>
    <div id="cr-seatsblock"></div>
    <div class="ar-sheet-actions"><button class="ar-btn gs-primary" id="cr-go" type="button" data-t="shell.start">Start</button></div>
  </div>
</div>
<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="handoff.js"></script>
<script src="courtier.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q142714">About Courtier</a></footer><!-- /zimi-about -->
</body>
</html>
