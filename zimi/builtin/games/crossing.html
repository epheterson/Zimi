<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crossing - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="pixel.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Crossing</h1>
  <button class="ar-btn" id="cr-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="cr-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="play.score">Score</small><b id="cr-score">0</b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="cr-best">0</b></div>
    <div class="pl-stat"><small data-t="play.lives">Lives</small><b id="cr-lives">3</b></div>
    <div class="pl-stat"><small data-t="play.level">Level</small><b id="cr-level">1</b></div>
  </div>
  <canvas class="px-screen" id="cr-screen" role="img" aria-label="The crossing: a chick at the bottom, five lanes of traffic, a grass strip, five lanes of river with logs and turtles, and five nests at the top" data-t-aria="crossing.screen"></canvas>
  <p class="pl-msg" id="cr-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="pixelkit.js"></script>
<script src="crossing.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q524267">About Crossing</a></footer><!-- /zimi-about -->
</body>
</html>
