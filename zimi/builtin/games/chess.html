<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="boardui.css">
<link rel="stylesheet" href="chess.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" data-t-aria="shell.back" aria-label="Back">&lsaquo;</a>
  <h1>Chess</h1>
  <button class="ar-btn" id="wk-undo" type="button" disabled data-t="board.undo">Undo</button>
  <button class="ar-btn" id="wk-new" type="button" aria-haspopup="dialog" data-t="shell.menu.new">New game</button>
</header>

<main class="bg-main is-rail">
  <p class="bg-status" id="wk-status"></p>
  <div class="bg-caps" id="cs-caps-top"></div>
  <div class="bg-board cs-board" id="cs-board" role="group" data-t-aria="chess.board" aria-label="Chess board"></div>
  <div class="bg-caps" id="cs-caps-bot"></div>
  <div class="bg-controls">
    <button class="ar-btn" id="wk-hint" type="button" disabled data-t="board.hint" data-t-title="chess.hintTitle" title="Show a good move (H)">Hint</button>
    <button class="ar-btn" id="cs-flip" type="button" aria-pressed="false" data-t="board.flip" data-t-title="chess.flipTitle" title="Turn the board around (F)">Flip</button>
  </div>
  <p class="bu-quiet cs-opening" id="cs-opening" dir="auto" aria-live="polite"></p>
  <div class="bu-quiet cs-moves" id="cs-moves" dir="ltr" role="log" data-t-aria="chess.moves" aria-label="Moves"></div>
  <p class="bg-stats" id="wk-stats"></p>
</main>

<script src="util.js"></script>
<script src="boardkit.js"></script>
<script src="boardui.js"></script>
<script src="worldkit.js"></script>
<script src="enginekit.js"></script>
<script src="chess-pieces.js"></script>
<script src="chess-engine.js"></script>
<script src="engines/fairy.js"></script>
<script src="chess-content.js"></script>
<script src="chess.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q718">About Chess</a></footer><!-- /zimi-about -->
</body>
</html>
