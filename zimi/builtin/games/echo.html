<!doctype html>
<html lang="en">
<head>

<body>
<header class="ar-bar">

  <p class="pl-msg ec-msg" id="ec-msg"></p>
  <div class="ec-board" id="ec-board" role="group" aria-label="Four pads" data-t-aria="echo.pads"></div>
</main>
