<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blast - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="blast.css">
<link rel="stylesheet" href="pixel.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Blast</h1>
  <button class="ar-btn" id="bl-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="bl-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="blast.round.label">Round</small><b id="bl-round">1</b></div>
    <div class="bl-wins" id="bl-wins" role="group" aria-label="Rounds won" data-t-aria="blast.roundsWon"></div>
  </div>
  <canvas class="px-screen" id="bl-screen" role="img" aria-label="The arena: bombers, soft blocks, stone pillars, bombs and power-ups" data-t-aria="blast.screen"></canvas>
  <p class="pl-msg" id="bl-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="pixelkit.js"></script>
<script src="gridwalk.js"></script>
<script src="blast.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q2583040">About Blast</a></footer><!-- /zimi-about -->
</body>
</html>
