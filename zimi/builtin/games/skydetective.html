<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Detective - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="library.css">
<link rel="stylesheet" href="roundkit.css">
<link rel="stylesheet" href="skydetective.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Sky Detective</h1>
  <span class="ar-stat" id="sk-score" aria-live="polite"></span>
  <button class="ar-btn" id="sk-new" type="button" hidden data-t="shell.menu.new">New game</button>
</header>

<main class="pl-main sk-main">
  <p class="sk-where" id="sk-where"></p>
  <canvas class="sk-dome" id="sk-dome" role="img" aria-label="The sky" data-t-aria="sky.domeAria"></canvas>
  <p class="sk-q" id="sk-q"></p>
  <div class="rk-choices" id="sk-choices" role="group" aria-label="Choices" data-t-aria="round.choices"></div>
  <p class="pl-msg" id="sk-msg"></p>
  <p class="sk-fact" id="sk-fact" hidden></p>
  <div class="gs-actionrow">
    <button class="ar-btn" id="sk-look" type="button" hidden></button>
    <button class="ar-btn" id="sk-sky" type="button" hidden></button>
    <a class="ar-btn" id="sk-read" href="#" hidden></a>
    <button class="ar-btn gm-play" id="sk-next" type="button" hidden></button>
  </div>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="librarykit.js"></script>
<script src="skykit.js"></script>
<script src="skydetective.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q560575">About Sky Detective</a></footer><!-- /zimi-about -->
</body>
</html>
