<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fourfold - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="boardui.css">
<link rel="stylesheet" href="world.css">
<link rel="stylesheet" href="fourfold.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" data-t-aria="shell.back" aria-label="Back">&lsaquo;</a>
  <h1>Fourfold</h1>
  <button class="ar-btn" id="wk-undo" type="button" disabled data-t="board.undo">Undo</button>
  <button class="ar-btn" id="wk-new" type="button" aria-haspopup="dialog" data-t="shell.menu.new">New game</button>
</header>

<main class="bg-main">
  <p class="bg-status" id="wk-status"></p>
  <div class="bg-score" id="wk-score" data-t-aria="fourfold.players" aria-label="Players"></div>
  <div class="ff-board" id="ff-board" data-t-aria="fourfold.board" aria-label="Fourfold board"></div>
  <div class="ff-hand" id="ff-hand"><span class="ff-hand-pc" id="ff-hand-pc"></span><span class="ff-hand-text" id="ff-hand-text"></span></div>
  <div class="ff-tray" id="ff-tray" role="group" data-t-aria="fourfold.tray" aria-label="Pieces left"></div>
  <div class="bg-controls">
    <button class="ar-btn" id="wk-hint" type="button" disabled data-t="board.hint">Hint</button>
    <button class="ar-btn gs-primary" id="ff-give" type="button" disabled data-t="fourfold.give">Hand over</button>
  </div>
  <p class="bg-stats" id="wk-stats"></p>
</main>
<script src="util.js"></script>
<script src="boardkit.js"></script>
<script src="boardui.js"></script>
<script src="worldkit.js"></script>
<script src="enginekit.js"></script>
<script src="fourfold-engine.js"></script>
<script src="fourfold.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->

</body>
</html>
