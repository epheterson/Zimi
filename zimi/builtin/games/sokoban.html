<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sokoban - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="sokoban.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Sokoban</h1>
  <button class="ar-btn" id="sk-undo" type="button" disabled data-t="board.undo">Undo</button>
  <button class="ar-btn" id="sk-restart" type="button" data-t="sokoban.restart">Restart</button>
  <button class="ar-btn" id="sk-solution" type="button" data-t="sokoban.showSolution">Show solution</button>
  <button class="ar-btn" id="sk-new" type="button" hidden data-t="shell.menu.new">New game</button>
</header>

<main class="pl-main sk-main">
  <div class="pl-hud">
    <div class="pl-stat"><small id="sk-name-l">Level</small><b id="sk-name">1</b></div>
    <div class="pl-stat"><small data-t="sokoban.moves">Moves</small><b id="sk-moves">0</b></div>
    <div class="pl-stat"><small data-t="sokoban.pushes">Pushes</small><b id="sk-pushes">0</b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="sk-best">-</b></div>
  </div>
  <p class="pl-msg" id="sk-msg"></p>
  <div class="sk-board" id="sk-board" tabindex="0" role="img" aria-label="Sokoban board" data-t-aria="sokoban.board"></div>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="boardkit.js"></script>
<script src="sokoban-engine.js"></script>
<script src="data/sokoban-levels.js"></script>
<script src="sokoban.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q605445">About Sokoban</a></footer><!-- /zimi-about -->
</body>
</html>
