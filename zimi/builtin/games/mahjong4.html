<html lang="en">
<head>
<meta charset="utf-8">

<title>Mahjong for Four - ZimiGames</title>
<link rel="stylesheet" href="games.css">

<link rel="stylesheet" href="board.css">

<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->

<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" data-t-aria="shell.back" aria-label="Back">&lsaquo;</a>
  <h1>Mahjong for Four</h1>
  <button class="ar-btn" id="wk-new" type="button" aria-haspopup="dialog" data-t="shell.menu.new">New game</button>
</header>

<main class="bg-main m4-main">
  <p class="bg-status" id="wk-status"></p>
  <div class="bg-score" id="wk-score" data-t-aria="mahjong4.players" aria-label="Players and points"></div>
  <p class="m4-info" id="m4-info"></p>
  <div class="m4-opps" id="m4-opps"></div>
  <div class="m4-pool" id="m4-pool" data-t-aria="mahjong4.discardsLabel" aria-label="Discards"></div>
  <div class="m4-claim" id="m4-claim" hidden role="group" data-t-aria="mahjong4.options" aria-label="Your options"></div>
  <div class="m4-me">
    <div class="m4-melds" id="m4-melds" data-t-aria="mahjong4.melds" aria-label="Your melds"></div>
    <div class="m4-hand" id="m4-hand" role="group" data-t-aria="mahjong4.hand" aria-label="Your hand"></div>
  </div>
  <div class="bg-controls"><button class="ar-btn" id="wk-hint" type="button" disabled data-t="board.hint">Hint</button><button class="ar-btn" id="m4-rules" type="button" aria-haspopup="dialog" data-t="mahjong4.scoring">Scoring</button></div>
  <p class="bg-stats" id="wk-stats"></p>
</main>

<script src="util.js"></script>
<script src="boardkit.js"></script>
<script src="boardui.js"></script>
<script src="worldkit.js"></script>
<script src="mahjong-tiles.js"></script>
<script src="mahjong4-engine.js"></script>
