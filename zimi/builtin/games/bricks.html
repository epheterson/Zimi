<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bricks - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Bricks</h1>
  <button class="ar-btn" id="br-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="br-pause" type="button" disabled data-t="play.pause">Pause</button>
</header>

<main class="pl-main">
  <div class="pl-hud">
    <div class="pl-stat"><small data-t="play.score">Score</small><b id="br-score">0</b></div>
    <div class="pl-stat"><small data-t="play.level">Level</small><b id="br-level">1</b></div>
    <div class="pl-stat"><small data-t="bricks.balls">Balls</small><b id="br-lives" role="img"></b></div>
    <div class="pl-stat"><small data-t="play.best">Best</small><b id="br-best">0</b></div>
  </div>
  <canvas class="pl-canvas" id="br-board" role="img" aria-label="The wall, the ball and your paddle" data-t-aria="bricks.board"></canvas>
  <p class="pl-msg" id="br-msg"></p>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="bricks.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q177491">About Bricks</a></footer><!-- /zimi-about -->
</body>
</html>
