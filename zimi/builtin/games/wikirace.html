<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki Race - ZimiGames</title>
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="play.css">
<link rel="stylesheet" href="library.css">
<link rel="stylesheet" href="wikirace.css">
<!-- zimi-shell --><script src="shell.js"></script><!-- /zimi-shell -->
</head>
<body>
<header class="ar-bar">
  <a class="ar-back" href="index.html" aria-label="Back to ZimiGames">&lsaquo;</a>
  <h1>Wiki Race</h1>
  <span class="ar-stat" id="rc-clicks" aria-live="polite"></span>
  <button class="ar-btn" id="rc-new" type="button" hidden data-t="shell.menu.new">New game</button>
  <button class="ar-btn" id="rc-give" type="button" disabled data-t="race.giveUp">Give up</button>
</header>

<main class="pl-main rc-main" id="rc-main">
  <p class="pl-msg" id="rc-msg"></p>
  <div class="rc-target" id="rc-target" aria-label="The race, from the start to the target" data-t-aria="race.targetAria"></div>
  <div class="rc-trail" id="rc-trail" aria-label="Your path so far" data-t-aria="race.trailAria"></div>
  <div class="rc-pane" id="rc-pane" aria-live="polite"></div>
  <div class="gs-actionrow">
    <button class="ar-btn" id="rc-back" type="button" disabled data-t="shell.back">Back</button>
    <button class="ar-btn" id="rc-share" type="button" hidden data-t="race.copy">Copy result</button>
  </div>
</main>

<script src="util.js"></script>
<script src="playkit.js"></script>
<script src="librarykit.js"></script>
<script src="wikirace-data.js"></script>
<script src="wikirace.js"></script>
<!-- zimi-recent --><script defer src="recent.js"></script><!-- /zimi-recent -->
<!-- zimi-about --><footer class="gm-about"><a href="about.html?qid=Q7999881">About Wiki Race</a></footer><!-- /zimi-about -->
</body>
</html>
