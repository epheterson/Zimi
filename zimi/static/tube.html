<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZimiTube</title>
<style>
  :root { color-scheme: light dark; --bg: #f2efe9; --surface: #faf8f4; --surface2: #f3f0ea; --border: #e4dfd4; --text: #26241f; --text2: #6a675e; --amber: #b5541c; --amber-glow: rgba(181,84,28,0.08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --surface: #1f1f23; --surface2: #26262b; --border: #27272b; --text: #e8e8ed; --text2: #8a8a94; --amber: #e0863a; --amber-glow: rgba(224,134,58,0.12); } }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  .tube { max-width: 1240px; margin: 0 auto; padding: 14px 16px 32px; }
  @media (max-width: 480px) { .tube { padding: 10px 12px 28px; } }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 12px; }
  .bar .n { color: var(--text2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .bar select { font: inherit; font-size: 12.5px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 5px 10px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 0 14px; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip img { width: 16px; height: 16px; border-radius: 4px; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .shelf { margin: 0 0 22px; }
  .shelf-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .shelf-h img { width: 22px; height: 22px; border-radius: 6px; }
  .shelf-h h2 { font-size: 15px; margin: 0; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shelf-h .all { color: var(--amber); font-size: 12.5px; font-weight: 600; cursor: pointer; background: none; border: 0; padding: 4px 0; }
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: 232px; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 6px; scrollbar-width: thin; }
  @media (max-width: 480px) { .row { grid-auto-columns: 68vw; } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; gap: 12px; } }
  .card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; scroll-snap-align: start; cursor: pointer; }
  .card:hover, .card:focus-visible { border-color: var(--amber); outline: none; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface2); display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur { position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.75); color: #fff; font-variant-numeric: tabular-nums; }
  .thumb .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; opacity: 0; transition: opacity .15s; background: rgba(0,0,0,0.18); }
  .card:hover .play { opacity: 1; }
  .body { padding: 11px 13px 13px; display: flex; gap: 10px; }
  .body img { width: 26px; height: 26px; border-radius: 7px; flex: none; margin-top: 1px; }
  .body .letter { width: 26px; height: 26px; border-radius: 7px; flex: none; background: var(--surface2); color: var(--text2); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .txt { min-width: 0; }
  .title { font-weight: 600; font-size: 14px; line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: 4px; font-size: 12px; color: var(--text2); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { display: block; margin: 22px auto 8px; padding: 9px 20px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text); cursor: pointer; }
  .more:hover { border-color: var(--amber); color: var(--amber); }
  .empty { color: var(--text2); text-align: center; padding: 48px 12px; line-height: 1.8; }
  .empty .door { color: var(--amber); font-weight: 600; }
  /* the player */
  .player { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; }
  @media (max-width: 900px) { .player { grid-template-columns: 1fr; } }
  .stage { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; }
  .stage video { width: 100%; height: 100%; display: block; background: #000; }
  .stage .nomedia { color: #ddd; padding: 32px; text-align: center; }
  .about { padding: 12px 2px 0; }
  .about h1 { font-size: 18px; margin: 0 0 6px; line-height: 1.3; }
  .who { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 13px; margin: 0 0 10px; }
  .who img { width: 28px; height: 28px; border-radius: 8px; }
  .who b { color: var(--text); font-weight: 600; }
  .desc { font-size: 13.5px; color: var(--text); white-space: pre-wrap; max-width: 70ch; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
  .actions a, .actions button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 12.5px; }
  .actions .on { background: var(--amber-glow); border-color: var(--amber); color: var(--amber); }
  .next h3 { font-size: 13px; margin: 0 0 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
  .next .item { display: grid; grid-template-columns: 124px 1fr; gap: 10px; margin: 0 0 10px; cursor: pointer; align-items: start; }
  .next .item .thumb { border-radius: 8px; overflow: hidden; }
  .next .item .t { font-weight: 600; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .next .item .m { font-size: 11.5px; color: var(--text2); margin-top: 2px; }
  .next .item.now .t { color: var(--amber); }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--amber); font-weight: 600; background: none; border: 0; padding: 0 0 12px; cursor: pointer; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tube">
  <div id="home">
    <div class="bar"><span class="n" id="n"></span>
      <select id="sort" onchange="setSort(this.value)"></select></div>
    <div class="chips" id="chips"></div>
    <div id="shelves"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
    <button class="more" id="more" hidden onclick="tubeMore()"></button>
  </div>
  <div id="watch" hidden>
    <button class="back" onclick="closePlayer()">&#8592; <span id="backlabel">ZimiTube</span></button>
    <div class="player">
      <div>
        <div class="stage" id="stage"></div>
        <div class="about">
          <h1 id="w-title"></h1>
          <div class="who" id="w-who"></div>
          <div class="desc" id="w-desc"></div>
          <div class="actions">
            <button id="autoplay" onclick="toggleAutoplay()"></button>
            <a id="w-open" href="#"></a>
          </div>
        </div>
      </div>
      <div class="next"><h3 id="w-nexth"></h3><div id="w-next"></div></div>
    </div>
  </div>
</div>
<script>
// ZimiTube. One feed across every video ZIM, read from each ZIM's own index
// by the server (/tube). The home is shelves, one per source, like a video
// site's; a query or a source chip is a grid; a card plays in ZimiTube's own
// player (/tube/play reads the media behind the video's page), with the rest
// of the list up next and autoplay into it. The original page is one tap
// away. The search box in Zimi's top bar drives tubeSearch(q).
var PAGE = 60;
var STR = { title: 'ZimiTube', videos: 'videos', sources: 'sources', more: 'More', none: 'No videos match.', empty: 'No video ZIMs installed yet.',
  up_next: 'Up next', autoplay: 'Autoplay', open_page: 'Open the original page', all: 'All',
  sort_top: 'Top', sort_title: 'Title', sort_newest: 'Newest', sort_longest: 'Longest', no_media: 'This video cannot be played here; open its page instead.' };
try { var s0 = JSON.parse(decodeURIComponent(location.hash.slice(1) || '') || '{}'); for (var k0 in s0) STR[k0] = s0[k0]; } catch (e) {}
var _q = '', _zim = '', _sort = 'top', _all = [], _zims = [], _list = [], _shown = 0, _busy = false, _autoplay = true, _now = -1;
try { _sort = localStorage.getItem('zimitube_sort') || 'top'; if (_sort === 'mixed') _sort = 'top'; _autoplay = localStorage.getItem('zimitube_autoplay') !== '0'; } catch (e) {}

function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function zpath(zim, p) { return '/w/' + encodeURIComponent(zim) + '/' + String(p).split('/').map(encodeURIComponent).join('/'); }
function iconHtml(v, cls) { return v.zim_icon ? '<img class="' + cls + '" src="' + esc(zpath(v.zim, '-/icon')) + '" alt="" loading="lazy">' : '<span class="letter ' + cls + '">' + esc((v.zim_title || v.zim || '?')[0].toUpperCase()) + '</span>'; }
function secs(d) { if (d == null || d === '') return 0; if (typeof d === 'string' && /:/.test(d)) { return d.split(':').reduce(function(a, b) { return a * 60 + (parseInt(b, 10) || 0); }, 0); } return parseInt(d, 10) || 0; }
function fmtDur(d) { var n = secs(d); if (!(n > 0)) return ''; var h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), sec = n % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0'); }

function card(v, i) {
  var thumb = v.thumb ? zpath(v.zim, v.thumb) : '';
  var who = [v.speaker, v.zim_title].filter(Boolean).join(' \u00b7 ');
  return '<a class="card" href="' + esc(zpath(v.zim, v.page)) + '" data-i="' + i + '" onclick="return play(event, ' + i + ')">' +
    '<span class="thumb">' + (thumb ? '<img src="' + esc(thumb) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      '<span class="play"><svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>' +
      (fmtDur(v.duration) ? '<span class="dur">' + esc(fmtDur(v.duration)) + '</span>' : '') + '</span>' +
    '<span class="body">' + iconHtml(v, '') + '<span class="txt"><span class="title">' + esc(v.title) + '</span>' +
      '<span class="meta">' + esc(who) + '</span></span></span></a>';
}

// The order on screen. "Top" is the server's interleave, each source's
// own order (TED lists its most watched first) taken in turns; the rest sort
// what is loaded, with what a source did not say (a date, a length) last.
function sorted(items) {
  var a = items.slice();
  if (_sort === 'title') a.sort(function(x, y) { return String(x.title).localeCompare(String(y.title)); });
  else if (_sort === 'newest') a.sort(function(x, y) { return String(y.date || '').localeCompare(String(x.date || '')); });
  else if (_sort === 'longest') a.sort(function(x, y) { return secs(y.duration) - secs(x.duration); });
  return a;
}

function renderHome() {
  var chips = document.getElementById('chips'), shelves = document.getElementById('shelves'), grid = document.getElementById('grid'),
      empty = document.getElementById('empty'), more = document.getElementById('more'), n = document.getElementById('n'), sort = document.getElementById('sort');
  sort.innerHTML = ['top', 'title', 'newest', 'longest'].map(function(k) { return '<option value="' + k + '"' + (k === _sort ? ' selected' : '') + '>' + esc(STR['sort_' + k]) + '</option>'; }).join('');
  chips.innerHTML = (_zims.length > 1 ? '<button class="chip' + (!_zim ? ' on' : '') + '" onclick="setZim(\'\')">' + esc(STR.all) + '</button>' : '') +
    _zims.map(function(z) { return '<button class="chip' + (_zim === z.name ? ' on' : '') + '" onclick="setZim(' + JSON.stringify(z.name).replace(/"/g, '&quot;') + ')">' +
      (z.icon ? '<img src="' + esc(zpath(z.name, '-/icon')) + '" alt="">' : '') + esc(z.title) + ' <span style="opacity:.6">' + z.count + '</span></button>'; }).join('');
  chips.hidden = _zims.length < 2;
  _list = sorted(_all.filter(function(v) { return !_zim || v.zim === _zim; }));
  var browsing = !_q && !_zim && _zims.length > 1 && _sort === 'top';
  // Shelves: one per source, its first dozen; the grid under them is
  // everything in the chosen order. With a query or a chip: the grid alone.
  shelves.innerHTML = browsing ? _zims.map(function(z) {
    var mine = _all.filter(function(v) { return v.zim === z.name; }).slice(0, 12);
    return '<section class="shelf"><div class="shelf-h">' + (z.icon ? '<img src="' + esc(zpath(z.name, '-/icon')) + '" alt="">' : '') +
      '<h2>' + esc(z.title) + '</h2><button class="all" onclick="setZim(' + JSON.stringify(z.name).replace(/"/g, '&quot;') + ')">' + esc(STR.all) + ' ' + z.count + ' \u203a</button></div>' +
      '<div class="row">' + mine.map(function(v) { return card(v, _list.indexOf(v)); }).join('') + '</div></section>';
  }).join('') : '';
  // Browsing shows the shelves and nothing else: the grid under them
  // repeated every card a second time. The grid is for a chip, a query or
  // another order.
  _shown = browsing ? 0 : Math.min(_list.length, Math.max(_shown, PAGE));
  grid.innerHTML = browsing ? '' : _list.slice(0, _shown).map(function(v, i) { return card(v, i); }).join('');
  n.textContent = _list.length ? _list.length + ' ' + STR.videos + (_zims.length > 1 && !_zim ? ' \u00b7 ' + _zims.length + ' ' + STR.sources : '') : '';
  empty.hidden = _list.length > 0;
  empty.innerHTML = _q ? esc(STR.none) : esc(STR.empty) + (STR.catalog ? '<br><a class="door" href="/?manage" onclick="return goCatalog()">' + esc(STR.catalog) + ' \u203a</a>' : '');
  more.hidden = browsing || _shown >= _list.length;
  more.textContent = STR.more;
}

function load() {
  if (_busy) return; _busy = true;
  var url = '/tube?limit=5000&offset=0' + (_q ? '&q=' + encodeURIComponent(_q) : '');
  fetch(url).then(function(r) { return r.json(); }).then(function(d) {
    _all = d.items || []; _zims = d.zims || []; _shown = 0; renderHome();
    // Opened at an address: play what it names, once, then it is a page like
    // any other visit here.
    if (STR.play) { var want = STR.play; STR.play = ''; var i = _list.findIndex(function(v) { return v.zim + '/' + v.page === want; }); if (i >= 0) play(null, i); }
  }).catch(function() { document.getElementById('empty').hidden = false; document.getElementById('empty').textContent = STR.none; })
    .finally(function() { _busy = false; });
}
function tubeMore() { _shown += PAGE; renderHome(); }
function tubeSearch(q) { _q = (q || '').trim(); closePlayer(true); load(); }
function setSort(v) { _sort = v; try { localStorage.setItem('zimitube_sort', v); } catch (e) {} _shown = 0; renderHome(); }
function setZim(name) { _zim = name; _shown = 0; renderHome(); window.scrollTo(0, 0); }
function toggleAutoplay() { _autoplay = !_autoplay; try { localStorage.setItem('zimitube_autoplay', _autoplay ? '1' : '0'); } catch (e) {} paintAutoplay(); }
function paintAutoplay() { var b = document.getElementById('autoplay'); b.textContent = STR.autoplay + (_autoplay ? ' \u2713' : ''); b.className = _autoplay ? 'on' : ''; }

// ZimiTube's own player. The media behind the video's page, in a plain
// <video> with the page's subtitle tracks; the rest of the list up next;
// autoplay rolls into the next one. Modifier-click keeps the link's own
// behaviour (the page, in a new tab).
function play(e, i) {
  if (e && (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1)) return true;
  if (e) e.preventDefault();
  var v = _list[i]; if (!v) return false;
  _now = i;
  document.getElementById('home').hidden = true;
  var watch = document.getElementById('watch'); watch.hidden = false;
  document.getElementById('backlabel').textContent = STR.title;
  document.getElementById('w-title').textContent = v.title;
  document.getElementById('w-who').innerHTML = iconHtml(v, '') + '<span>' + (v.speaker ? '<b>' + esc(v.speaker) + '</b> \u00b7 ' : '') + esc(v.zim_title) + (v.date ? ' \u00b7 ' + esc(v.date) : '') + '</span>';
  document.getElementById('w-desc').textContent = v.description || '';
  var open = document.getElementById('w-open'); open.href = zpath(v.zim, v.page); open.textContent = STR.open_page;
  document.getElementById('w-nexth').textContent = STR.up_next;
  paintAutoplay();
  var stage = document.getElementById('stage'); stage.innerHTML = '';
  window.scrollTo(0, 0);
  tell({ zimi: 'tube-play', play: v.zim + '/' + v.page, title: v.title });
  fetch('/tube/play?zim=' + encodeURIComponent(v.zim) + '&page=' + encodeURIComponent(v.page)).then(function(r) { return r.ok ? r.json() : null; }).then(function(m) {
    if (_now !== i) return;
    if (!m || !m.media || !m.media.length) { stage.innerHTML = '<div class="nomedia">' + esc(STR.no_media) + '</div>'; return; }
    var vid = document.createElement('video');
    vid.controls = true; vid.autoplay = true; vid.playsInline = true; vid.preload = 'auto';
    if (m.poster) vid.poster = zpath(v.zim, m.poster);
    m.media.forEach(function(src) { var s = document.createElement('source'); s.src = zpath(v.zim, src.path); if (src.type) s.type = src.type; vid.appendChild(s); });
    (m.subs || []).forEach(function(t, k) { var tr = document.createElement('track'); tr.kind = 'subtitles'; tr.src = zpath(v.zim, t.path); tr.srclang = t.lang || ''; tr.label = t.label || t.lang || 'subtitles'; if (k === 0 && /^en/.test(t.lang || '')) tr.default = true; vid.appendChild(tr); });
    vid.addEventListener('ended', function() { if (_autoplay && _now === i && _list[i + 1]) play(null, i + 1); });
    stage.appendChild(vid);
    var p = vid.play(); if (p && p.catch) p.catch(function() {});
  }).catch(function() { stage.innerHTML = '<div class="nomedia">' + esc(STR.no_media) + '</div>'; });
  var next = document.getElementById('w-next');
  next.innerHTML = _list.slice(Math.max(0, i - 1), i + 12).map(function(w) {
    var j = _list.indexOf(w);
    return '<div class="item' + (j === i ? ' now' : '') + '" onclick="play(null, ' + j + ')"><span class="thumb">' + (w.thumb ? '<img src="' + esc(zpath(w.zim, w.thumb)) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      (fmtDur(w.duration) ? '<span class="dur">' + esc(fmtDur(w.duration)) + '</span>' : '') + '</span><div><div class="t">' + esc(w.title) + '</div><div class="m">' + esc([w.speaker, w.zim_title].filter(Boolean).join(' \u00b7 ')) + '</div></div></div>';
  }).join('');
  return false;
}
function tell(msg) { try { if (window.parent !== window) window.parent.postMessage(msg, location.origin); } catch (e) {} }
function goCatalog() { tell({ zimi: 'catalog', category: 'ted' }); return false; }
function closePlayer(silent) {
  var stage = document.getElementById('stage'); stage.innerHTML = '';
  if (_now >= 0) tell({ zimi: 'tube-home' });
  _now = -1;
  document.getElementById('watch').hidden = true;
  document.getElementById('home').hidden = false;
  if (!silent) window.scrollTo(0, 0);
}
window.tubeSearch = tubeSearch; window.tubeMore = tubeMore; window.play = play; window.closePlayer = closePlayer;
window.setSort = setSort; window.setZim = setZim; window.toggleAutoplay = toggleAutoplay;
load();
</script>
</body>
</html>
