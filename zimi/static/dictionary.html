<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictionary</title>
<!--@apps.css@-->
<style>
  /* One word, as every installed Wiktionary describes it, a language at a
     time. The word is set large in a book face; what it means is the body;
     where it came from and the words around it are quieter, under it. Every
     word on the page is a way to the next one. */
  :root { --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
    --ipa: "Charis SIL", "Doulos SIL", "Gentium Plus", "Gentium", "Segoe UI", "Lucida Grande", "DejaVu Sans", system-ui, sans-serif; }
  .page { max-width: 760px; }
  /* A word you can follow: there, not shouting. The definitions are read
     first; the links are found when wanted. */
  a.w { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, currentColor 22%, transparent); text-underline-offset: 3px; cursor: pointer; }
  a.w:hover, a.w:focus-visible { color: var(--amber); text-decoration-color: var(--amber); }
  [lang] { unicode-bidi: isolate; }

  /* Where you have been: the words that led here, each a step back. */
  .trail { display: flex; align-items: center; gap: 2px 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 0 14px; font-size: 13px; color: var(--text2); white-space: nowrap; }
  .trail::-webkit-scrollbar { display: none; }
  .trail button { border: 0; background: none; padding: 6px 2px; color: var(--text2); cursor: pointer; font: inherit; unicode-bidi: isolate; }
  .trail button:hover { color: var(--amber); }
  .trail .now { color: var(--text); font-weight: 600; padding: 6px 2px; unicode-bidi: isolate; }
  .trail .chev { opacity: .5; }

  /* The word. */
  .hw { margin: 2px 0 18px; }
  .hw h1 { font: 600 40px/1.1 var(--serif); margin: 0; color: var(--text); overflow-wrap: anywhere; unicode-bidi: plaintext; }
  .hw .also { margin: 8px 0 0; font-size: 13px; color: var(--text2); }
  .hw .actions { margin: 14px 0 0; }
  @media (max-width: 480px) { .hw h1 { font-size: 34px; } }

  /* A language the word is in: its name, how it sounds, then each
     Wiktionary's account of it. */
  .lang { margin: 0 0 26px; }
  .lang > summary, .lang-h { list-style: none; display: flex; align-items: baseline; gap: 10px; padding: 10px 0 8px; border-top: 1px solid var(--border); cursor: default; }
  .lang > summary::-webkit-details-marker { display: none; }
  .lang-h h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
  .lang-h .peek { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: plaintext; }
  .lang-h .peek:empty { display: none; }
  details.lang > summary { cursor: pointer; }
  details.lang > summary::after { content: ''; flex: none; width: 7px; height: 7px; margin-inline-start: auto; border-inline-end: 1.5px solid var(--text2); border-bottom: 1.5px solid var(--text2); transform: rotate(45deg) translateY(-3px); }
  details.lang[open] > summary::after { transform: rotate(-135deg) translateY(-1px); }
  details.lang:not([open]) { margin-bottom: 0; }
  details.lang:not([open]) + details.lang:not([open]) > summary { border-top-style: dotted; }

  /* How it sounds: the IPA, and a way to hear it. */
  .say { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 4px 0 14px; }
  .spk { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; min-width: 34px; padding: 0 12px 0 10px; border-radius: 17px; border: 0; background: var(--amber); color: #fff; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 12.5px; line-height: 1; }
  .spk svg { width: 16px; height: 16px; flex: none; }
  .spk.on { filter: brightness(1.12); box-shadow: 0 0 0 4px var(--amber-glow); }
  .spk.sm { height: 26px; min-width: 26px; padding: 0 8px; background: var(--amber-glow); color: var(--amber); }
  .spk.sm svg { width: 13px; height: 13px; }
  .ipa { font-family: var(--ipa); font-size: 16px; color: var(--text); unicode-bidi: isolate; direction: ltr; }
  .ipas { display: flex; flex-direction: column; gap: 4px; margin: 0 0 14px; }
  .ipas .ipr { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .ipas .more-ipa { border: 0; background: none; padding: 2px 0; color: var(--text2); font: inherit; font-size: 12.5px; cursor: pointer; text-align: start; }
  .ipas .acc { font-size: 12px; color: var(--text2); min-width: 0; }
  .novoice { font-size: 12.5px; color: var(--text2); }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--text2); margin: -6px 0 14px; }
  .facts b { font-weight: 600; color: var(--text2); margin-inline-end: 4px; }

  /* One Wiktionary's account. */
  .src-h { font-size: 11.5px; color: var(--text2); margin: 16px 0 6px; display: flex; align-items: center; gap: 6px; }
  .src-h img { width: 14px; height: 14px; border-radius: 4px; }
  .src-h:first-child { margin-top: 0; }
  .ety { font-size: 13.5px; line-height: 1.55; color: var(--text2); margin: -4px 0 18px; unicode-bidi: plaintext; overflow-wrap: anywhere; }
  .ety .k, .sh { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
  .ety .k { margin-inline-end: 6px; }
  .pos { margin: 0 0 18px; }
  .pos-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 6px; }
  .pos-h .p { font: italic 600 15px/1.3 var(--serif); color: var(--text); }
  .pos-h .hl { font-size: 13px; color: var(--text2); unicode-bidi: plaintext; overflow-wrap: anywhere; }
  ol.senses { margin: 0; padding-inline-start: 22px; }
  ol.senses > li { margin: 0 0 10px; padding-inline-start: 4px; font-size: 15px; line-height: 1.5; unicode-bidi: plaintext; overflow-wrap: anywhere; }
  ol.senses > li::marker { color: var(--text2); font-size: 13px; font-variant-numeric: tabular-nums; }
  ol.senses ol.senses { margin-top: 6px; list-style: lower-alpha; }
  ol.senses ol.senses > li { font-size: 14px; }
  .ex + .ex { margin-top: 0; padding-top: 4px; }
  .ex { margin: 4px 0 0; padding-inline-start: 12px; border-inline-start: 2px solid var(--border); font: italic 14px/1.45 var(--serif); color: var(--text2); unicode-bidi: plaintext; }
  .nym { margin: 4px 0 0; font-size: 13px; color: var(--text2); }
  .nym .k { margin-inline-end: 4px; }

  /* The words around it: synonyms, derived terms, rhymes; each a door. */
  .words { margin: 10px 0 0; }
  .words .sh { margin: 0 0 6px; }
  .cloud { display: flex; flex-wrap: wrap; gap: 6px; }
  .cloud a, .cloud button { font-size: 13px; padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; unicode-bidi: isolate; font-family: inherit; }
  .cloud a:hover, .cloud a:focus-visible { border-color: var(--amber); color: var(--amber); }
  .cloud button { color: var(--text2); background: none; border-style: dashed; }

  /* Translations into the reader's languages, a sense at a time. */
  .trans { margin: 12px 0 0; }
  .trans .gl { font-size: 12.5px; color: var(--text2); margin: 8px 0 4px; unicode-bidi: plaintext; }
  .trans dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 14px; }
  .trans dt { color: var(--text2); font-size: 13px; }
  .trans dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .trans dd .tr { color: var(--text2); font-size: 12px; margin-inline-start: 3px; }
  .trans .all { margin: 8px 0 0; border: 0; background: none; padding: 6px 0; color: var(--amber); font-family: inherit; font-weight: 600; font-size: 12.5px; cursor: pointer; }

  /* The front: today's word, then yours. */
  .wotd { display: block; padding: 18px 18px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); cursor: pointer; color: inherit; margin: 0 0 26px; }
  .wotd:hover, .wotd:focus-visible { border-color: var(--amber); outline: none; }
  .wotd .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
  .wotd .w { font: 600 32px/1.15 var(--serif); margin: 6px 0 2px; color: var(--text); overflow-wrap: anywhere; unicode-bidi: plaintext; }
  .wotd .p { font: italic 14px/1.3 var(--serif); color: var(--text2); }
  .wotd .b { font-size: 14.5px; line-height: 1.5; margin: 8px 0 0; unicode-bidi: plaintext; }
  .wotd .s { font-size: 11.5px; color: var(--text2); margin: 10px 0 0; }
  .shelf-h h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); }
  .dicts { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--text2); }
  .dicts div { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .dicts img { width: 16px; height: 16px; border-radius: 4px; }
  .dicts .n { margin-inline-start: auto; font-variant-numeric: tabular-nums; font-size: 12px; }
  .hint { color: var(--text2); font-size: 13.5px; margin: 0 0 22px; }

  /* What the box finds while you type. */
  .sug { display: flex; flex-direction: column; }
  .sug a { display: flex; align-items: baseline; gap: 10px; padding: 11px 4px; border-top: 1px solid var(--border); color: var(--text); text-decoration: none; cursor: pointer; }
  .sug a:first-child { border-top: 0; }
  .sug a:hover .t, .sug a:focus-visible .t { color: var(--amber); }
  .sug .t { font: 600 17px/1.3 var(--serif); unicode-bidi: plaintext; overflow-wrap: anywhere; min-width: 0; }
  .sug .in { margin-inline-start: auto; font-size: 11px; color: var(--text2); white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }

  .sk { height: 14px; border-radius: 7px; background: var(--surface2); margin: 10px 0; }
  .sk.big { height: 38px; width: 46%; margin: 4px 0 22px; }
  .note { font-size: 13px; color: var(--text2); }
  @media (pointer: coarse) {
    .trail button, .trail .now { padding-block: 12px; }
    .cloud a, .cloud button { padding: 8px 12px; }
    .spk.sm { height: 34px; min-width: 34px; }
    .trans .all { padding-block: 12px; }
  }
</style>
</head>
<body>
<div class="page">
  <nav class="trail" id="trail" hidden></nav>
  <div id="view"></div>
</div>
<!--@apps.js@-->
<script>
// Dictionary. A word as every installed Wiktionary describes it, grouped by
// the language the word is in (not the language of the Wiktionary), the
// reader's own languages first; each word on the page opens the next, and
// the trail above says how you got here. Zimi's top bar drives
// dictSearch(q) as you type and dictGo(q) on Enter.
var STR = strings({ title: 'Dictionary', word_of_day: 'Word of the Day', recent: 'Recent', saved_words: 'Saved', sources: 'Your dictionaries',
  etymology: 'Etymology', translations: 'Translations', all_translations: 'All {n} translations', fewer_translations: 'Only my languages',
  synonyms: 'Synonyms', antonyms: 'Antonyms', homophones: 'Homophones', rhymes: 'Rhymes',
  hyphenation: 'Hyphenation', other_languages: 'In other languages', from: 'From {source}', say: 'Say it', say_word: 'Say “{word}”',
  recording: 'Recording', no_voice: 'No {lang} voice on this device', not_found: 'No dictionary here has “{word}”.', near: 'Did you mean',
  empty: 'No Wiktionary installed yet.', more: '{n} more', load_failed: 'Couldn\'t look this up.', also: 'Also', hint: 'Type a word in the box above to look it up.',
  entries: '{n} words', retry: 'Retry', catalog: 'Browse the catalog' });

// ── pure parts (tests/test_dictionary_page.cjs runs these) ───────────────
var WORDS_SHOWN = 14;     // of a list of words, before "n more"
var IPA_SHOWN = 3;       // accents shown before "n more"
var RECENT_SHOWN = 16;
var SAVED_SHOWN = 30;
var VOICE_WAIT_MS = 1200; // a browser that lists its voices late (Chrome) is given this long
var SPEECH_RATE = 0.9;    // a word said a little slowly is a word you can hear
var SPEECH_AFTER_CANCEL_MS = 60; // iOS ignores a speak() in the same turn as cancel()

// A Wiktionary's code for a language as a speech engine knows it. English
// Wiktionary names Mandarin cmn and Cantonese yue; voices are zh-CN and
// zh-HK. Norwegian is no, nb or nn on one side and nb or no on the other.
var SPEECH_CODES = { cmn: 'zh-CN', zh: 'zh-CN', yue: 'zh-HK', arb: 'ar', iw: 'he', 'in': 'id', tl: 'fil', nn: 'nb', no: 'nb' };
var SAME_LANGUAGE = { nb: ['nb', 'no'], he: ['he', 'iw'], id: ['id', 'in'], fil: ['fil', 'tl'] };
// An accent as a Wiktionary labels it, as a region: "General American" is
// en-US, "Received Pronunciation" en-GB, French Wiktionary's "France" fr-FR,
// "Canada" en-CA or fr-CA by the word's language. The first that matches.
var ACCENT_REGIONS = [
  [/\b(US|General American|American|cot.caught)/i, 'US'],
  [/[ÉE]tats-Unis/i, 'US'],
  [/Royaume-Uni|Angleterre|[ÉE]cosse/i, 'GB'],
  [/\b(General Australian|Australia)/i, 'AU'],
  [/New Zealand/i, 'NZ'],
  [/\b(UK|Received Pronunciation|RP|Southern England|Standard Southern British|British|England|Estuary|Cockney|Scotland|Scottish|Wales|Welsh)\b/i, 'GB'],
  [/\b(Canada|Canadian|Qu[ée]bec)/i, 'CA'],
  [/\b(Ireland|Irish)\b/i, 'IE'],
  [/\bIndia/i, 'IN'],
  [/South Africa/i, 'ZA'],
  [/\b(Brazil|Brasil|Brazilian)/i, 'BR'],
  [/\bPortugal|European Portuguese/i, 'PT'],
  [/\b(Spain|España|Castilian|Peninsular)/i, 'ES'],
  [/\b(Mexico|México|Latin America|Latinoamérica)/i, 'MX'],
  [/\b(Belgique|Belgium)/i, 'BE'],
  [/\b(Suisse|Switzerland)/i, 'CH'],
  [/\b(Austria|Österreich)/i, 'AT'],
  [/\b(France|Paris)\b/i, 'FR'],
  [/\b(Germany|Deutschland)\b/i, 'DE'],
  [/\bTaiwan/i, 'TW'],
  [/\bHong Kong/i, 'HK']
];
// Voices made to amuse, not to pronounce (macOS ships them under en-US).
var NOVELTY_VOICES = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Fred|Junior|Ralph|Kathy|Princess)\b/i;

// Languages written right to left, among those a Wiktionary is written in
// or a word is: Arabic and its spoken forms, Hebrew, Persian, Urdu, Yiddish...
var RTL_LANGS = ['ar', 'arz', 'apc', 'ajp', 'ary', 'aeb', 'arq', 'acm', 'he', 'iw', 'fa', 'ur', 'yi', 'ps', 'ckb', 'sd', 'ug', 'dv', 'syc', 'arc'];
function dirOf(code) { return RTL_LANGS.indexOf(primaryOf(code)) >= 0 ? 'rtl' : 'ltr'; }
function primaryOf(code) { return String(code || '').split(/[-_]/)[0].toLowerCase(); }
function regionOf(tag) { var p = String(tag || '').split(/[-_]/); return p.length > 1 ? p[p.length - 1].toUpperCase() : ''; }
// The tag a word's language is spoken by, "" for a language no voice could
// have (a reconstruction, a dead language's code with a hyphen: "gem-pro").
function speechTag(code) {
  code = String(code || '').trim();
  if (!code) return '';
  var low = code.toLowerCase();
  if (SPEECH_CODES[low]) return SPEECH_CODES[low];
  if (/-pro$/.test(low)) return '';
  return code;
}
function accentRegion(accent) {
  for (var i = 0; i < ACCENT_REGIONS.length; i++) if (ACCENT_REGIONS[i][0].test(accent || '')) return ACCENT_REGIONS[i][1];
  return '';
}
function sameLanguage(a, b) {
  if (a === b) return true;
  var g = SAME_LANGUAGE[a] || SAME_LANGUAGE[b];
  return !!g && g.indexOf(a) >= 0 && g.indexOf(b) >= 0;
}
// The voice to say a word in code, with the accent's region where one has
// it: {voice, exact} (exact: the region matched), or null when no voice
// speaks the language. Never another language's voice: a French word read
// by an English voice is a wrong answer said with confidence.
function pickVoice(voices, code, accent) {
  var tag = speechTag(code);
  if (!tag) return null;
  var want = primaryOf(tag), region = accentRegion(accent) || regionOf(tag);
  // A Chinese voice is the region's: Cantonese is not Mandarin.
  var strictRegion = want === 'zh';
  var best = null, bestScore = -1;
  (voices || []).forEach(function(v) {
    if (!v || !v.lang || NOVELTY_VOICES.test(v.name || '')) return;
    if (!sameLanguage(primaryOf(v.lang), want)) return;
    var exact = !!region && regionOf(v.lang) === region;
    if (strictRegion && region && !exact) return;
    var score = (exact ? 8 : 0) + (v.localService ? 2 : 0) + (/premium|enhanced|natural|neural/i.test(v.name || '') ? 3 : 0) + (v['default'] ? 1 : 0);
    if (score > bestScore) { best = { voice: v, exact: exact }; bestScore = score; }
  });
  return best;
}
// The reader's languages, first the one Zimi speaks, then the browser's.
function readerLangs(uiLang, browserLangs) {
  var out = [];
  [uiLang].concat(browserLangs || []).forEach(function(l) { var p = primaryOf(l); if (p && out.indexOf(p) < 0) out.push(p); });
  return out;
}
// The languages a word is in, the reader's first (in their order), then as
// the Wiktionaries gave them.
function orderGroups(groups, langs) {
  var rank = function(g) { var i = langs.indexOf(primaryOf(g.code)); return i < 0 ? langs.length : i; };
  return groups.map(function(g, i) { return { g: g, i: i }; })
    .sort(function(a, b) { return (rank(a.g) - rank(b.g)) || (a.i - b.i); })
    .map(function(x) { return x.g; });
}
// "eau#French" -> {w: 'eau', sec: 'French'}.
function parseTarget(t) {
  t = String(t || '');
  var i = t.indexOf('#');
  return i < 0 ? { w: t, sec: '' } : { w: t.slice(0, i), sec: t.slice(i + 1) };
}
// Which language group a link's section names: by the heading's name in
// any Wiktionary that has it, or by code (French Wiktionary's "#fr").
function groupFor(groups, sec) {
  if (!sec) return -1;
  var s = sec.toLowerCase();
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    if ((g.code || '').toLowerCase() === s) return i;
    for (var z in g.names) if (String(g.names[z]).toLowerCase() === s) return i;
  }
  return -1;
}
// What can be heard for a language: its recordings, then each IPA row.
function soundsOf(group) {
  // Every recording; the IPA of the first Wiktionary that writes it down
  // (two editions transcribe one accent two ways: /ˈwɔː.tə/ and \\ˈwɔː.tə\\).
  var ipa = [], seen = {}, audio = [];
  group.entries.forEach(function(e) {
    (e.pron.audio || []).forEach(function(a) { audio.push(a); });
    if (ipa.length) return;
    (e.pron.ipa || []).forEach(function(r) {
      var k = r.ipa.join(' ');
      if (!seen[k]) { seen[k] = 1; ipa.push(r); }
    });
  });
  return { ipa: ipa, audio: audio };
}
// A word's first sense, for a language folded away.
function firstSense(group) {
  for (var i = 0; i < group.entries.length; i++) {
    var gs = group.entries[i].groups;
    for (var j = 0; j < gs.length; j++) for (var k = 0; k < gs[j].parts.length; k++) {
      var s = gs[j].parts[k].senses[0];
      if (s) return plain(s.d);
    }
  }
  return '';
}
// A definition cut to fit a card ends in an ellipsis, not mid-phrase.
function cutShort(t) { t = String(t || '').trim(); return /[.!?。।)”"]$/.test(t) ? t : t + '…'; }
function plain(segs) { return (segs || []).map(function(s) { return typeof s === 'string' ? s : s[0]; }).join(''); }
function fill(s, vars) { return String(s || '').replace(/\{(\w+)\}/g, function(m, k) { return vars[k] != null ? vars[k] : m; }); }
// Today on the reader's clock, as the server asks for it.
function dayStamp(d) { d = d || new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
// The day's word: the one from a Wiktionary in the reader's language first.
function pickToday(words, langs) {
  if (!words || !words.length) return null;
  for (var i = 0; i < langs.length; i++) for (var j = 0; j < words.length; j++) if (primaryOf(words[j].lang) === langs[i]) return words[j];
  return words[0];
}

// ── views ────────────────────────────────────────────────────────────────
var LANGS = readerLangs(STR.lang, (typeof navigator !== 'undefined' && navigator.languages) || []);
var _home = null, _stack = [{ v: 'home' }], _seq = 0, _words = {}, _today = null;
function $(id) { return document.getElementById(id); }
function cur() { return _stack[_stack.length - 1]; }
var FAILED = { failed: true };
function get(url) { return fetch(url).then(function(r) { return r.ok ? r.json() : FAILED; }).catch(function() { return FAILED; }); }
function langName(code, fallback) {
  if (code) {
    try {
      var n = new Intl.DisplayNames([STR.lang || 'en'], { type: 'language', fallback: 'none' }).of(code);
      if (n && n.toLowerCase() !== code.toLowerCase()) return n;
    } catch (e) {}
  }
  return fallback || code || '';
}
function englishName(code) {
  try { return new Intl.DisplayNames(['en'], { type: 'language', fallback: 'none' }).of(code) || ''; } catch (e) { return ''; }
}
function groupName(g) {
  var names = Object.keys(g.names || {}).map(function(z) { return g.names[z]; });
  return langName(g.code, names[0]);
}
function wordUrl(w) { return '/?dictionary=' + encodeURIComponent(w); }
function wordLink(text, target, lang) {
  return '<a class="w" href="' + esc(wordUrl(parseTarget(target).w)) + '" data-w="' + esc(target) + '"' + (lang ? ' lang="' + esc(lang) + '"' : '') + '>' + esc(text) + '</a>';
}
function segHtml(segs) {
  return (segs || []).map(function(s) { return typeof s === 'string' ? esc(s) : wordLink(s[0], s[1]); }).join('');
}
function failedHtml(msg, retry) {

  [window, window.parent].forEach(function(w) { try { if (w.navigator.audioSession) w.navigator.audioSession.type = 'playback'; } catch (e) {} });
}
function wantPlaybackForSpeech() {
  wantPlayback();
  try { var a = new Audio(silenceUrl()); a.play().catch(function() {}); } catch (e) {}
}
function say(b) {
  var s = synth(), c = pickVoice(voices(), b.getAttribute('data-code'), b.getAttribute('data-accent'));
  if (!s || !c) { wireSpeech(); return; }
  wantPlaybackForSpeech();
  var u = new SpeechSynthesisUtterance(b.getAttribute('data-say'));
  u.voice = c.voice; u.lang = c.voice.lang; u.rate = SPEECH_RATE;
  b.classList.add('on');
  u.onend = u.onerror = function() { b.classList.remove('on'); if (_utterance === u) _utterance = null; };
  // Held until it ends: Safari lets an unreferenced utterance be collected
  // mid-word, and its end never comes.
  _utterance = u;
  // iOS drops a speak() that follows cancel() in the same moment: cancel only
  // what is still talking, and speak on the next turn when it was.
  if (s.speaking || s.pending) { s.cancel(); setTimeout(function() { s.speak(u); }, SPEECH_AFTER_CANCEL_MS); }
  else s.speak(u);
}
function play(b) {
  wantPlayback();
  if (_playing) { try { _playing.pause(); } catch (e) {} }
  var a = new Audio(b.getAttribute('data-audio'));
  _playing = a;
  b.classList.add('on');
  a.onended = a.onerror = a.onpause = function() { b.classList.remove('on'); };
  a.play().catch(function() { b.classList.remove('on'); });
}

// Every word on the page opens the next; a modified click keeps the link
// for a new tab.
document.addEventListener('click', function(e) {
  var sp = e.target.closest && e.target.closest('[data-say],[data-audio]');
  if (sp) { e.preventDefault(); if (sp.hasAttribute('data-audio')) play(sp); else say(sp); return; }
  var a = e.target.closest && e.target.closest('a[data-w]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
  e.preventDefault();
  openWord(a.getAttribute('data-w'));
});

function load() {
  _home = null;
  renderHome();
  get('/dictionary/home').then(function(d) {
    _home = d;
    if (cur().v === 'home') renderHome();
    if (d !== FAILED && d.wiktionaries.length) {
      get('/dictionary/today?day=' + dayStamp()).then(function(t) { _today = t; if (cur().v === 'home') renderHome(); });
    }
  });
  var w = STR.w || '';
  if (w) { _stack.push({ v: 'word', w: w }); show(true); }
}

window.dictCurrent = dictCurrent; window.dictTranslation = dictTranslation;
window.dictSearch = dictSearch; window.dictGo = dictGo; window.toTrail = toTrail; window.moreWords = moreWords; window.moreIpa = moreIpa;
// A ZIM without an icon of its own: no broken picture in its place.
document.addEventListener('error', function(e) { if (e.target && e.target.tagName === 'IMG') e.target.remove(); }, true);
window.allTranslations = allTranslations; window.goCatalog = goCatalog; window.load = load; window.show = show;
// What you keep changed: the front's lists, or the word's Save.
window.__saved = function() { if (cur().v === 'home') renderHome(); else savedPaint(); };
window.__top = function() { return _stack.length <= 1; };
window.__back = back;
window.__home = function() { _stack = [{ v: 'home' }]; window.scrollTo(0, 0); show(); };
// Back or Forward to an address of this app: the word, or the front.
window.__route = function(w) {
  if (!w) { _stack = [{ v: 'home' }]; show(true); return; }
  if (cur().v === 'word' && cur().w === w) return;
  var at = -1;
  _stack.forEach(function(v, i) { if (v.v === 'word' && v.w === w) at = i; });
  if (at >= 0) _stack = _stack.slice(0, at + 1); else _stack.push({ v: 'word', w: w });
  show(true);
};
// The dice: a word by chance, from one of the Wiktionaries.
window.__random = function() {
  var ws = (_home && _home !== FAILED && _home.wiktionaries) || [];
  if (!ws.length) return;
  var z = ws[Math.floor(Math.random() * ws.length)].name;
  get('/random?zim=' + encodeURIComponent(z)).then(function(r) {
    if (r && r.title && !/[:\/]/.test(r.title)) openWord(r.title);
  });
};
load();
</script>
