<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zimipedia</title>
<!--@apps.css@-->
<style>
  /* The languages, each in its own name; then the wikis of the one chosen. */
  .langs { margin-bottom: 8px; }
  .langs .chip { font-weight: 600; }
  .chip .n { font-weight: 400; }
  .chips .sep { flex: none; width: 1px; align-self: stretch; margin: 4px 2px; background: var(--border); }
  /* The head: what is shown, and (for a search) the two ways to show it. */
  .head .views { display: inline-flex; gap: 2px; margin-inline-start: auto; border: 1px solid var(--border); border-radius: 10px; padding: 2px; background: var(--surface); }
  .head .views button { border: 0; background: none; padding: 4px 7px; border-radius: 8px; cursor: pointer; color: var(--text2); display: inline-flex; line-height: 0; }
  .head .views button.on { background: var(--surface2); color: var(--text); }
  .head .views svg { width: 16px; height: 16px; }
  .head .n .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--border); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; margin-inline-end: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .serif { font-family: Georgia, "Times New Roman", "Noto Serif", "Noto Serif Hebrew", serif; }

  /* Today, a front door: the day's article, where you were, the trails
     you took. Each part under a heading of its own. */
  .sec { margin: 0 0 28px; min-width: 0; }
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .sec-h h2 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; color: var(--text); }
  .src { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text2); min-width: 0; }
  .src img { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  .src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .lg { font-size: 9.5px; font-weight: 700; padding: 0 4px; border-radius: 3px; background: var(--surface2); text-transform: uppercase; flex: none; }

  /* The day's article: the page's lead, its picture beside it. */
  .hero { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; color: inherit; margin: 0 0 28px; }
  .hero:hover, .hero:focus-visible { border-color: var(--amber); outline: none; }
  .hero .pic { aspect-ratio: 16 / 9; background: var(--surface2); overflow: hidden; }
  .hero .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero .bd { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .kick { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
  .hero .t { font-size: 27px; line-height: 1.15; font-weight: 600; color: var(--text); }
  .hero .ex { font-size: 15px; line-height: 1.55; color: var(--text); display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .hero .more-l { font-size: 13px; font-weight: 600; color: var(--amber); margin-top: 4px; }
  @media (min-width: 760px) {
    .hero.has-pic { flex-direction: row; }
    .hero.has-pic .pic { flex: 0 0 46%; aspect-ratio: auto; min-height: 300px; }
    .hero .bd { justify-content: center; padding: 24px 28px; }
    .hero .t { font-size: 34px; }
  }

  /* Continue reading: an article you started, how far you are, a tap back in. */
  .cont { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .cont a { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: inherit; min-width: 0; }
  .cont a:hover, .cont a:focus-visible { border-color: var(--amber); outline: none; }
  .cont > a > img, .cont > a > .ic { flex: none; width: 52px; height: 52px; border-radius: var(--radius-s); object-fit: cover; background: var(--surface2); }
  .cont > a > .ic { width: 28px; height: 28px; margin: 12px; background: none; }
  .cont .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .cont .t { font-weight: 600; font-size: 15px; line-height: 1.25; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cont .prog { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .cont .prog i { display: block; height: 100%; background: var(--amber); }
  /* A trail: the articles one link at a time, each a way back in. */
  .trails { list-style: none; margin: 0; padding: 0; }
  .trails li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 4px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.4; }
  .trails li:first-child { border-top: 0; }
  .trails a { color: inherit; font-weight: 500; }
  .trails a:hover { color: var(--amber); }
  .trails a:last-of-type { font-weight: 600; }
  /* Each step of a trail is a finger's height on a touch screen. */
  @media (pointer: coarse) { .trails a { padding: 12px 0; margin: -12px 0; } }
  .trails .step { color: var(--text2); }
  .trails .when { margin-inline-start: auto; font-size: 12px; color: var(--text2); white-space: nowrap; }

  /* Cards: a picture when the page has one, its wiki, what it is, its title, its first lines. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; gap: 10px; } }
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; color: inherit; min-width: 0; }
  .card:hover, .card:focus-visible { border-color: var(--amber); outline: none; }
  .card .pic { aspect-ratio: 16 / 10; background: var(--surface2); display: block; overflow: hidden; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .bd { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .card .kick { font-size: 10.5px; }
  .card .t { font-weight: 600; font-size: 15px; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .ex { color: var(--text2); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .note { color: var(--text2); font-size: 13px; margin: 0; }
  .note button, .empty button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 16px; padding: 4px 12px; cursor: pointer; margin-inline-start: 8px; }
  /* The list: the apps' rows, a small picture where the number goes. */
  .row { color: inherit; }
  .row .stat img { width: 52px; height: 52px; object-fit: cover; border-radius: var(--radius-s); display: block; }
  .row .stat .ic { width: 28px; height: 28px; margin: 2px auto 0; border-radius: 7px; display: block; }
  .row .t + .ex { margin-top: 2px; }
  /* Waiting for a part. */
  .sk { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-height: 150px; }
  .sk.row-sk { min-height: 64px; border-radius: var(--radius-s); }
  .sk.hero-sk { min-height: 260px; margin: 0 0 28px; }
  .dym, .alllang { margin: 0 0 10px; color: var(--text2); font-size: 13px; }
  .dym button, .alllang button { border: 0; background: none; color: var(--amber); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
  /* The interface's words sit on the side the page is laid out from, and
     read in their own direction. */
  html[dir="rtl"] :is(.kick, .more-l, .note, .alllang, .dym) { text-align: right; }
  html:not([dir="rtl"]) :is(.kick, .more-l, .note, .alllang, .dym) { text-align: left; }
  /* The way onward points the way its own words run, whatever the page's. */
  .chev:dir(ltr)::before { content: '\203A'; }
  .chev:dir(rtl)::before { content: '\2039'; }
  /* A page's words keep their own direction under the shell's. */
  .card .bd > *, .hero .bd > *, .row .t, .row .ex, .cont .t, .trails a { unicode-bidi: plaintext; }
  .trails .step:dir(ltr)::before { content: '\203A'; }
  .trails .step:dir(rtl)::before { content: '\2039'; }
</style>
</head>
<body>
<div class="page">
  <div class="chips langs" id="langs" role="group"></div>
  <div class="chips" id="pills" role="group"></div>
  <div class="head">
    <h2 id="h"></h2><span class="n" id="n"></span>
    <span class="views" id="views" role="group" hidden></span>
  </div>
  <div id="today"></div>
  <div id="results" hidden></div>
  <div class="empty" id="empty" hidden></div>
</div>
<!--@apps.js@-->
<script>
// Zimipedia. Every wiki in the library, one language at a time: a chip per
// language the wikis are in (each named in itself), a pill per wiki of the
// language chosen, and Today, a front door: the day's article from the
// language's Wikipedia with its picture (worked out once a day by the
// server, zimi/wiki.py), the articles you are part way through (Saved's
// places, Zimipedia's), and the trails you took (the reader keeps them, in
// this browser). Articles open in Zimipedia's reader (static/wiki-reader.js,
// in the shell), which is where the rest of the app lives. Search is the
// language's wikis (or the pills chosen), and can reach every language when
// asked. Zimi's top bar drives wikiSearch(q).
// Eric, 2026-09-27: "just a homepage of mostly reused discover content? It
// not useful it doesn't own the pages or help dive in and learn better".
var STR = strings({ title: 'Zimipedia', all: 'All', today: 'Today', article: 'Article of the day', none: 'Nothing matches.', empty: 'No wiki installed yet.',
  catalog: 'Browse the catalog', cards: 'Cards', list: 'List', searching: 'Searching the full text', did_you_mean: 'Did you mean',
  search_heading: '“{q}”', results_one: '{n} result', results_other: '{n} results',
  load_failed: 'Zimipedia could not load its wikis.', search_failed: 'The search did not go through.', retry: 'Try again', langs: {},
  languages: 'Languages', read_more: 'Read the article', search_all_languages: 'Search all languages', search_one_language: 'Only {lang}',
  continue: 'Continue reading', trails: 'Recent trails' });

// ── pure parts (tests/test_wiki_page.cjs runs these) ──────────────────────
var SEARCH_LIMIT = 30;
var SNIPPETS_FETCHED = 12;
var CONTINUE_SHOWN = 6;
var TRAILS_SHOWN = 5;

// The browser's own date, as the day the picks belong to.
function dayStamp(d) { return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); }

// A pill's words: the project for a Wikimedia wiki, the ZIM's title for any
// other, and the title too when two wikis of one project share a language
// (all of English Wikipedia beside its top-100 subset).
function pillLabels(wikis) {
  var seen = {};
  wikis.forEach(function(w) { var k = (w.project_title || w.title) + '|' + w.language; seen[k] = (seen[k] || 0) + 1; });
  var out = {};
  wikis.forEach(function(w) {
    var base = w.project_title || w.title;
    out[w.name] = seen[base + '|' + w.language] > 1 ? w.title : base;
  });
  return out;
}

// The languages written right to left: the page takes the direction of
// the language it shows.
var RTL_LANGS = /^(ar|arc|arz|azb|ckb|dv|fa|glk|he|ks|lrc|mzn|nqo|pnb|ps|sd|skr|ug|ur|yi)$/;
function dirOf(code) { return RTL_LANGS.test(String(code || '').split('-')[0]) ? 'rtl' : 'ltr'; }
// The interface's own words (a heading, a kicker, a date) keep the
// interface's language and direction on a page laid out in the content's,
// so an English "Did you know…" over Hebrew reads left to right with its
// ellipsis at its end.
function ui() { var l = STR.lang || 'en'; return ' lang="' + esc(l) + '" dir="' + dirOf(l) + '"'; }
function uiEl(el) { var l = STR.lang || 'en'; el.setAttribute('lang', l); el.setAttribute('dir', dirOf(l)); return el; }
// A language named in itself (עברית, Français, ייִדיש), which is how a
// reader finds their own: the shell's _langEndonym, given the server's name
// for it (/wiki/home's languages: it knows the ones a browser cannot name in
// themselves) and the interface's name as the last resort.
function endonym(code, fallback) {
  var own = (_langs.filter(function(l) { return l.code === code; })[0] || {}).name;
  try { return window.parent._langEndonym(code, own, fallback); } catch (e) { return own || fallback || code; }
}

// The wikis of one language.
function inLanguage(wikis, lang) { return wikis.filter(function(w) { return w.language === lang; }); }

// The day's article comes from the biggest Wikipedia of the language (a full
// build before a mini, whose articles are their introductions), or any wiki
// when there is no Wikipedia; null when there is no wiki.
function heroOf(wikis) {
  var wps = wikis.filter(function(w) { return w.project === 'wikipedia'; });
  var lead = wps.slice().sort(function(a, b) { return ((a.flavour === 'mini') - (b.flavour === 'mini')) || (b.entries || 0) - (a.entries || 0); })[0] || wikis[0] || null;
  return lead ? lead.name : null;
}
// The articles part read, of the language shown (Saved's places, the
// latest first): its wikis' only.
function continuedIn(places, lang, by) {
  return (places || []).filter(function(p) { return by[p.zim] && by[p.zim].language === lang && p.where && p.where.f > 0; });
}
// The recent trails of the language shown: those that started in one of
// its wikis, each once.
function trailsIn(kept, lang, by) {
  return (kept || []).filter(function(tr) {
    return tr && tr.items && tr.items.length > 1 && by[tr.items[0].zim] && by[tr.items[0].zim].language === lang;
  });
}
// "2 h", "3 d": how long ago, in the interface's words.
function ago(ts, now) {
  var s = Math.max(0, (now - ts) / 1000), u = [['day', 86400], ['hour', 3600], ['minute', 60]];
  for (var i = 0; i < u.length; i++) if (s >= u[i][1]) {
    var n = Math.floor(s / u[i][1]);
    try { return new Intl.RelativeTimeFormat(STR.lang || 'en', { numeric: 'auto', style: 'short' }).format(-n, u[i][0]); } catch (e) { return n + ' ' + u[i][0]; }
  }
  try { return new Intl.RelativeTimeFormat(STR.lang || 'en', { numeric: 'auto' }).format(0, 'minute'); } catch (e) { return ''; }
}

// "3 results" in the interface's language, whatever its plural forms
// (Arabic has six, Russian three).
function plural(n) {
  var cat = 'other';
  try { cat = new Intl.PluralRules(STR.lang || 'en').select(n); } catch (e) {}
  return String(STR['results_' + cat] || STR.results_other).replace('{n}', n);
}
// A search's heading, in the quotation marks of the interface's language.
// The words searched for keep their own direction inside the marks: HTML.
function heading(q) { return esc(String(STR.search_heading || '“{q}”')).replace('{q}', '<bdi>' + esc(q) + '</bdi>'); }
// Quick title matches first, then the full text's, each article once.
function mergeResults(first, second) {
  var seen = {}, out = [];
  (first || []).concat(second || []).forEach(function(r) {
    var k = r.zim + '/' + r.path;
    if (!seen[k]) { seen[k] = 1; out.push(r); }
  });
  return out;
}

function stripTags(s) { return String(s || '').replace(/<[^>]+>/g, ''); }
// A lead's first lines as a card reads them: no footnote marks ([1],
// [ note 1 ], [ b ]), no space inside brackets or before punctuation, and a
// quote in one pair of quotation marks.
function cleanBlurb(s) {
  return stripTags(s).replace(/\[\s*[^\]\s][^\]]{0,14}\]/g, '').replace(/([(\[])\s+/g, '$1').replace(/\s+([)\],.;:!?])/g, '$1')
    .replace(/^“\s*["“]\s*/, '“').replace(/\s*["”]\s*”$/, '”').replace(/\s{2,}/g, ' ').trim();
}

// ── state ────────────────────────────────────────────────────────────────
var VIEW_KEY = 'zimi_wiki_view';
var TODAY_KEY = 'zimi_wiki_today';
var LANG_KEY = 'zimi_wiki_lang';
// What the page shows of a wiki's day: its pick (the server works out more
// for the API: /wiki/today's parts).
var PARTS = ['picks'];
var _wikis = [], _by = {}, _labels = {}, _langs = [], _lang = '', _sel = [], _q = '', _hits = [], _searchSeq = 0, _view = 'cards';
var _everyLanguage = false;  // this search reaches every language
var _day = dayStamp(new Date());
// Today's answers, per part and wiki. Kept for the day in this browser, only
// when there is something in them: an empty answer or a failure is asked
// again next time.
var _got = {};
var _failed = {};  // wikis whose last ask failed: asked again on the next view
try { _view = localStorage.getItem(VIEW_KEY) === 'list' ? 'list' : 'cards'; } catch (e) {}
function storedLang() { try { return localStorage.getItem(LANG_KEY) || ''; } catch (e) { return ''; } }
function emptyGot() { var g = {}; PARTS.forEach(function(p) { g[p] = {}; }); return g; }
function readKept() {
  _got = emptyGot();
  try {
    var kept = JSON.parse(localStorage.getItem(TODAY_KEY) || 'null');
    if (kept && kept.day === _day) PARTS.forEach(function(p) { _got[p] = kept[p] || {}; });
  } catch (e) {}
}
readKept();
// Something worth keeping: a pick with a page.
function hasContent(v) { return v && (Array.isArray(v) ? v.length > 0 : Object.keys(v).length > 0); }
function absorb(d) {
  var keep = false;
  PARTS.forEach(function(p) {
    var part = (d && d[p]) || {};
    for (var n in part) { _got[p][n] = part[n] || {}; if (hasContent(part[n])) keep = true; }
  });
  if (!keep) return;
  var store = { day: _day };
  PARTS.forEach(function(p) { store[p] = {}; for (var n in _got[p]) if (hasContent(_got[p][n])) store[p][n] = _got[p][n]; });
  try { localStorage.setItem(TODAY_KEY, JSON.stringify(store)); } catch (e) {}
}

// The page is laid out in the direction of the language it shows.
function applyDir() {
  var code = _lang || STR.lang || 'en';
  document.documentElement.lang = code;
  document.documentElement.dir = dirOf(code);
}
function langWikis() { return inLanguage(_wikis, _lang); }
function scoped() { return _sel.length ? langWikis().filter(function(w) { return _sel.indexOf(w.name) >= 0; }) : langWikis(); }
function langName(code) { return (STR.langs && STR.langs[code]) || code; }
function srcLine(zim) {
  var w = _by[zim] || { name: zim, title: zim };
  return '<span class="src">' + (w.icon ? zimIcon(w.name) : '') + '<span>' + esc(_labels[zim] || w.title) + '</span>' +
    (_everyLanguage && w.language ? '<span class="lg">' + esc(w.language) + '</span>' : '') + '</span>';
}
// A wiki's words carry its language, so a Hebrew quote under an English
// shell is read, hyphenated and quoted as Hebrew.
function langAttr(zim) { var w = _by[zim]; return w && w.language ? ' lang="' + esc(w.language) + '" dir="auto"' : ''; }
function linkAttrs(zim, path) { return ' href="' + esc(zpath(zim, path)) + '" data-zim="' + esc(zim) + '" data-path="' + esc(path) + '"'; }

// ── views (a search's results: cards or a list) ──────────────────────────
var ICON_CARDS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
var ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>';
function renderViews() {
  var host = document.getElementById('views');
  host.hidden = !_q;
  host.innerHTML = [['cards', ICON_CARDS, STR.cards], ['list', ICON_LIST, STR.list]].map(function(v) {
    return '<button type="button" class="' + (_view === v[0] ? 'on' : '') + '" aria-pressed="' + (_view === v[0]) + '" title="' + esc(v[2]) + '" aria-label="' + esc(v[2]) + '" onclick="setView(\'' + v[0] + '\')">' + v[1] + '</button>';
  }).join('');
}
function setView(v) {
  _view = v;
  try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
  renderViews();
  if (_q) renderResults();
}

// A search's result, as a card or (in the list view) a row. it: {zim, path,
// title, blurb, thumb}.
function itemHtml(it, asRow) {
  var la = langAttr(it.zim);
  var data = linkAttrs(it.zim, it.path);
  if (asRow) {
    var w = _by[it.zim] || {};
    var stat = it.thumb ? '<img src="' + esc(it.thumb) + '" alt="" loading="lazy">' : (w.icon ? zimIcon(w.name, 'ic') : '');
    return '<a class="row"' + data + '><div class="stat">' + stat + '</div><div>' +
      '<div class="t"' + la + '>' + esc(it.title) + '</div>' + (it.blurb ? '<div class="ex"' + la + '>' + esc(it.blurb) + '</div>' : '') +
      '<div class="m">' + srcLine(it.zim) + '</div></div></a>';
  }
  var pic = it.thumb ? '<span class="pic"><img src="' + esc(it.thumb) + '" alt="" loading="lazy"></span>' : '';
  return '<a class="card"' + data + '>' + pic + '<span class="bd"><span class="t serif"' + la + '>' + esc(it.title) + '</span>' +
    (it.blurb ? '<span class="ex"' + la + '>' + esc(it.blurb) + '</span>' : '') + srcLine(it.zim) + '</span></a>';
}
function itemsHtml(items) {
  var asRow = !!_q && _view === 'list';
  var inner = items.map(function(it) { return itemHtml(it, asRow); }).join('');
  return asRow ? '<div class="rows">' + inner + '</div>' : '<div class="grid">' + inner + '</div>';
}
function skeletons(n) {
  var asRow = !!_q && _view === 'list';
  var one = asRow ? '<div class="sk row-sk"></div>' : '<div class="sk"></div>';
  return asRow ? new Array(n + 1).join(one) : '<div class="grid">' + new Array(n + 1).join(one) + '</div>';
}

// ── Today ────────────────────────────────────────────────────────────────
var _todaySeq = 0;
function heroHtml(p) {
  var la = langAttr(p.zim);
  return '<a class="hero' + (p.thumbnail ? ' has-pic' : '') + '"' + linkAttrs(p.zim, p.path) + '>' +
    (p.thumbnail ? '<span class="pic"><img src="' + esc(p.thumbnail) + '" alt=""></span>' : '') +
    '<span class="bd"><span class="kick"' + ui() + '>' + esc(STR.article) + '</span>' +
    '<span class="t serif"' + la + '>' + esc(p.title || p.path) + '</span>' +
    (p.blurb ? '<span class="ex"' + la + '>' + esc(cleanBlurb(p.blurb)) + '</span>' : '') +
    '<span class="more-l"' + ui() + '>' + esc(STR.read_more) + CHEV + '</span>' + srcLine(p.zim) + '</span></a>';
}
// Continue reading: each at the section you were in.
function continueHtml(list) {
  return '<div class="cont">' + list.map(function(p) {
    var w = _by[p.zim] || {}, m = p.meta || {};
    var pic = m.thumb ? '<img src="' + esc(m.thumb) + '" alt="" loading="lazy">' : (w.icon ? zimIcon(w.name, 'ic') : '<span class="ic"></span>');
    return '<a' + linkAttrs(p.zim, p.path + (p.where.s ? '#' + p.where.s : '')) + '>' + pic + '<span class="bd"><span class="t"' + langAttr(p.zim) + '>' + esc(p.title || p.path) + '</span>' +
      '<span class="prog"><i style="width:' + Math.round(Math.min(1, p.where.f) * 100) + '%"></i></span>' + srcLine(p.zim) + '</span></a>';
  }).join('') + '</div>';
}
// A trail: its articles in the order taken; a tap goes back in there, with
// the trail as it was.
function trailsHtml(list) {
  var now = Date.now();
  return '<ol class="trails">' + list.map(function(tr, k) {
    return '<li>' + tr.items.map(function(s, i) {
      return (i ? '<span class="step" aria-hidden="true"></span>' : '') + '<a' + linkAttrs(s.zim, s.path) + ' data-trail="' + k + '"' + langAttr(s.zim) + '>' + esc(s.title || s.path) + '</a>';
    }).join('') + '<span class="when"' + ui() + '>' + esc(ago(tr.ts, now)) + '</span></li>';
  }).join('') + '</ol>';
}
// A part of Today: a heading, and what it holds.
function section(id, title, inner) {
  return '<section class="sec" id="s-' + id + '"><div class="sec-h"><h2 class="serif"' + ui() + '>' + esc(title) + '</h2></div><div class="sb">' + inner + '</div></section>';
}
// The recent trails, which Zimipedia's reader keeps in this browser: the
// shell's (_wikiTrailsKept), none on a page open outside it.
function keptTrails() { try { return window.parent._wikiTrailsKept() || []; } catch (e) { return []; } }
var _trailsShown = [];
function drawYours() {
  var host = document.getElementById('yours');
  if (!host) return;
  var S = saved();
  var cont = continuedIn(S ? S.continued({ app: 'wiki' }) : [], _lang, _by).slice(0, CONTINUE_SHOWN);
  _trailsShown = trailsIn(keptTrails(), _lang, _by).slice(0, TRAILS_SHOWN);
  host.innerHTML = (cont.length ? section('continue', STR.continue, continueHtml(cont)) : '') +
    (_trailsShown.length ? section('trails', STR.trails, trailsHtml(_trailsShown)) : '');
}

function renderToday() {
  var seq = ++_todaySeq;
  var wikis = scoped();
  var hero = heroOf(wikis);
  var dateText = new Date().toLocaleDateString(STR.lang || undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  uiEl(document.getElementById('h')).textContent = STR.today;
  uiEl(document.getElementById('n')).textContent = dateText;
  renderViews();
  var host = document.getElementById('today');
  host.innerHTML = (hero ? '<div id="s-hero"><div class="sk hero-sk"></div></div>' : '') + '<div id="yours"></div>';
  drawYours();
  var draw = function() {
    if (seq !== _todaySeq || _q || !hero || _got.picks[hero] === undefined) return;
    var p = _got.picks[hero], hs = document.getElementById('s-hero');
    if (hs) hs.innerHTML = p && p.path ? heroHtml(p) : '';
  };
  draw();
  // The day's article, when /wiki/home did not carry it and this browser does not keep it.
  if (hero && (_failed[hero] || _got.picks[hero] === undefined)) {
    fetch('/wiki/today?day=' + _day + '&parts=picks&zim=' + encodeURIComponent(hero)).then(function(r) { return r.ok ? r.json() : null; })
      .catch(function() { return null; }).then(function(d) {
        if (d) absorb(d);
        // Not read: nothing now rather than a part that never fills, and
        // asked again on the next view.
        if (!d || (d.failed || []).indexOf(hero) >= 0) _failed[hero] = 1; else delete _failed[hero];
        if (_got.picks[hero] === undefined) _got.picks[hero] = {};
        draw();
      });
  }
  showEmpty();
}

// ── search ───────────────────────────────────────────────────────────────
function wikiSearch(q) {
  _q = (q || '').trim();
  var seq = ++_searchSeq;
  if (!_q) { showToday(); return; }
  renderViews();
  document.getElementById('today').hidden = true;
  document.getElementById('results').hidden = false;
  var zims = (_everyLanguage ? _wikis : scoped()).map(function(w) { return w.name; }).join(',');
  if (!zims) return;
  _hits = []; _dym = '';
  uiEl(document.getElementById('h')).innerHTML = heading(_q);
  setCount(true);
  document.getElementById('results').innerHTML = skeletons(_view === 'list' ? 4 : 6);
  var base = '/search?q=' + encodeURIComponent(_q) + '&zim=' + encodeURIComponent(zims) + '&limit=' + SEARCH_LIMIT;
  // A failed ask (rate limited, signed out, the server down) is not "nothing
  // matches": it says so, with a way to ask again.
  var get = function(url) { return fetch(url).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; }); };
  get(base + '&fast=1').then(function(d1) {
    if (seq !== _searchSeq) return;
    if (!d1) { searchFailed(); return; }
    _hits = mergeResults(d1.results, []);
    _dym = d1.did_you_mean || '';
    renderResults(!!d1.partial);
    snippets(seq);
    if (!d1.partial) return;
    get(base).then(function(d2) {
      if (seq !== _searchSeq) return;
      if (d2) { _hits = mergeResults(_hits, d2.results); _dym = _dym || d2.did_you_mean || ''; }
      renderResults(false);
      snippets(seq);
    });
  });
}
function searchFailed() {
  document.getElementById('n').textContent = '';
  document.getElementById('results').innerHTML = '<div class="empty">' + esc(STR.search_failed) + '<button type="button" onclick="wikiSearch(' + J(_q) + ')">' + esc(STR.retry) + '</button></div>';
}
var _dym = '';
function setCount(busy) {
  var n = _hits.length;
  document.getElementById('n').innerHTML = (busy ? '<span class="spin"></span>' + esc(STR.searching) : '') +
    (!busy || n ? (busy ? ' · ' : '') + esc(plural(n)) : '');
}
// A search reaches the language chosen; one tap reaches every language, and
// one more comes back.
function everyLanguage(on) { _everyLanguage = !!on; if (_q) wikiSearch(_q); }
function allLangLine() {
  if (_langs.length < 2) return '';
  var label = _everyLanguage ? String(STR.search_one_language).replace('{lang}', endonym(_lang, langName(_lang))) : STR.search_all_languages;
  return '<div class="alllang"' + ui() + '><button type="button" onclick="everyLanguage(' + !_everyLanguage + ')">' + esc(label) + '</button></div>';
}
function renderResults(busy) {
  var host = document.getElementById('results');
  setCount(!!busy);
  var dym = _dym && _dym.toLowerCase() !== _q.toLowerCase() ? '<div class="dym"' + ui() + '>' + esc(STR.did_you_mean) + ' <button type="button" onclick="wikiSearch(' + J(_dym) + ')">' + esc(_dym) + '</button></div>' : '';
  var head = dym + allLangLine();
  if (!_hits.length) { host.innerHTML = head + (busy ? skeletons(3) : '<div class="empty">' + esc(STR.none) + '</div>'); return; }
  host.innerHTML = head + itemsHtml(_hits.map(function(r) {
    return { zim: r.zim, path: r.path, title: r.title || r.path, blurb: cleanBlurb(r._blurb || r.snippet || ''), thumb: r._thumb || '' };
  }));
}
// The first lines and a picture for the top results, as the main search
// does: /snippet reads the start of each page once.
function snippets(seq) {
  _hits.slice(0, SNIPPETS_FETCHED).forEach(function(r) {
    if (r._asked) return;
    r._asked = true;
    fetch('/snippet?zim=' + encodeURIComponent(r.zim) + '&path=' + encodeURIComponent(r.path)).then(function(x) { return x.ok ? x.json() : null; }).then(function(d) {
      if (!d || seq !== _searchSeq) return;
      r._blurb = d.snippet || r.snippet || '';
      r._thumb = d.thumbnail || '';
      renderResults(false);
    }).catch(function() {});
  });
}
function showToday() {
  _q = ''; _searchSeq++; _everyLanguage = false;
  document.getElementById('results').hidden = true;
  document.getElementById('results').innerHTML = '';
  document.getElementById('today').hidden = false;
  renderToday();
}

// ── languages and pills ──────────────────────────────────────────────────
function renderLangs() {
  var host = document.getElementById('langs');
  host.setAttribute('aria-label', STR.languages);
  host.innerHTML = _langs.map(function(l) {
    var on = l.code === _lang;
    return '<button type="button" class="chip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" lang="' + esc(l.code) + '" title="' + esc(langName(l.code)) +
      '" onclick="setLang(' + J(l.code) + ')">' + esc(endonym(l.code, langName(l.code))) + ' <span class="n">' + l.wikis + '</span></button>';
  }).join('');
  host.hidden = _langs.length < 2;
}
function renderPills() {
  var host = document.getElementById('pills');
  var ws = langWikis();
  var h = '<button type="button" class="chip' + (!_sel.length ? ' on' : '') + '" aria-pressed="' + !_sel.length + '" onclick="pillAll()"' + ui() + '>' + esc(STR.all) + '</button>';
  var group = null;
  ws.forEach(function(w) {
    if (group !== null && w.project !== group) h += '<span class="sep" aria-hidden="true"></span>';
    group = w.project;
    var on = _sel.indexOf(w.name) >= 0;
    h += '<button type="button" class="chip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" title="' + esc(w.title) + '" onclick="pill(' + J(w.name) + ')">' +
      (w.icon ? zimIcon(w.name) : '') + esc(_labels[w.name]) + '</button>';
  });
  host.innerHTML = h;
  host.hidden = ws.length < 2;
}
// All on until one is tapped: the first tap narrows to that wiki, the next
// ones add or take away, and the last one taken away is all again.
function pill(name) {
  var i = _sel.indexOf(name);
  if (i >= 0) _sel.splice(i, 1); else _sel.push(name);
  scopeChanged();
}
function pillAll() { _sel = []; scopeChanged(); }
function scopeChanged() {
  renderPills();
  if (_q) wikiSearch(_q); else renderToday();
}
// Another language: the whole page follows, and this browser remembers it.
// What the server already knows of the language comes in one ask.
function setLang(code) {
  if (code === _lang) return;
  _lang = code; _sel = [];
  applyDir();
  try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
  renderLangs(); renderPills();
  if (_q) wikiSearch(_q); else renderToday();
  fetch('/wiki/home?day=' + _day + '&lang=' + encodeURIComponent(code)).then(function(r) { return r.ok ? r.json() : null; }).then(function(d) {
    if (d && d.day === _day && d.lang === _lang) { absorb(d); if (!_q) renderToday(); }
  }).catch(function() {});
}

function showEmpty() {
  var empty = uiEl(document.getElementById('empty'));
  empty.hidden = _wikis.length > 0;
  empty.innerHTML = esc(STR.empty) + '<br><a class="door" href="/?manage" onclick="return goCatalog()">' + esc(STR.catalog) + CHEV + '</a>';
  document.querySelector('.head').hidden = !_wikis.length;
}
// The list of wikis could not be read (the server rate limited this
// browser, a login lapsed, the server erred): not "no wiki installed".
function showLoadFailed() {
  var empty = uiEl(document.getElementById('empty'));
  empty.hidden = false;
  empty.innerHTML = esc(STR.load_failed) + '<br><button type="button" onclick="load()">' + esc(STR.retry) + '</button>';
  document.querySelector('.head').hidden = true;
  document.getElementById('today').innerHTML = '';
}
function goCatalog() { tell({ zimi: 'catalog', category: 'wikipedia' }); return false; }

// An article opens in Zimi's reader, with Zimipedia as the step behind it.
// A modified click keeps the link's own address for a new tab.
document.addEventListener('click', function(e) {
  var a = e.target.closest && e.target.closest('a[data-zim][data-path]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
  e.preventDefault();
  // A step of a recent trail: the trail is this tab's again, so the reader
  // goes on from there.
  var k = a.getAttribute('data-trail');
  if (k !== null && _trailsShown[+k]) { try { window.parent._wikiTrailResume(_trailsShown[+k].items); } catch (err) {} }
  tell({ zimi: 'open', zim: a.getAttribute('data-zim'), path: a.getAttribute('data-path') });
});

// The language asked for: this browser's last choice, else the interface's;
// the server settles it (English, else the language with the most wikis,
// when no wiki is in it).
function load() {
  fetch('/wiki/home?day=' + _day + '&lang=' + encodeURIComponent(storedLang() || STR.lang || 'en')).then(function(r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(d) {
    _wikis = d.wikis || [];
    _by = {}; _wikis.forEach(function(w) { _by[w.name] = w; });
    _labels = pillLabels(_wikis);
    _langs = d.languages || [];
    _lang = d.lang || '';
    applyDir();
    if (d.day === _day) absorb(d);
    renderLangs(); renderPills();
    if (_q) wikiSearch(_q); else renderToday();
  }).catch(function() { showLoadFailed(); });
}
// A page left open past midnight moves to the new day when it is looked at
// again: the picks are the day's.
function checkDay() {
  var d = dayStamp(new Date());
  if (d === _day) return;
  _day = d;
  readKept();
  if (_wikis.length && !_q) renderToday();
}
document.addEventListener('visibilitychange', function() { if (!document.hidden) checkDay(); });
window.addEventListener('focus', checkDay);

window.wikiSearch = wikiSearch; window.pill = pill; window.pillAll = pillAll; window.setView = setView; window.load = load;
window.setLang = setLang; window.everyLanguage = everyLanguage;
window.__top = function() { return !_q; };
window.__saved = function() { if (!_q) drawYours(); };
// Back from an article: where you were and the trail just taken are new.
window.addEventListener('pageshow', function() { if (_wikis.length && !_q) drawYours(); });
window.__back = function() { if (_q) { showToday(); return true; } return false; };
window.__home = function() { showToday(); window.scrollTo(0, 0); };
window.__route = function() { showToday(); };
// The dice: an article from one of the wikis chosen, in the language shown.
window.__random = function() {
  var ws = scoped();
  if (!ws.length) return;
  var w = ws[Math.floor(Math.random() * ws.length)];
  fetch('/random?zim=' + encodeURIComponent(w.name)).then(function(r) { return r.ok ? r.json() : null; }).then(function(d) {
    if (d && d.path) tell({ zimi: 'open', zim: w.name, path: d.path });
  }).catch(function() {});
};
load();
</script>
