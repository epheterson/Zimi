<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Declare both schemes so the UA knows the page is theme-aware; the boot
     below pins the *resolved* scheme via documentElement.style.colorScheme,
     which is what Safari paints the tab backdrop / scrollbars from. Without it,
     a light-app user on a dark-mode OS gets a dark compositor flash when
     switching back to the tab. -->
<meta name="color-scheme" content="light dark">
<title>Zimi</title>

<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=6">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zimi">
<link rel="manifest" href="/static/manifest.json">
<!-- Theme bootstrap — stamp data-theme AND color-scheme on <html> BEFORE the
     stylesheet applies so a light-app visitor never sees a dark flash. Mirrors
     _resolveAppTheme() in app.js (kept trivially in sync); app.js re-applies and
     installs the live prefers-color-scheme listener on load. Default = Auto
     (follow the OS), dark fallback when the media query is unavailable.
     colorScheme is set alongside data-theme because Safari paints the tab
     backdrop from it — that's the fix for the dark flash on tab re-activation.
     The pageshow(persisted) hook re-asserts after a bfcache restore, where no
     other script re-runs. -->
<script>
(function(){
  var el = document.documentElement;
  // Drop the transition-suppression guard once the themed first paint has
  // committed (double rAF), so normal interactions still animate. A load
  // backstop covers browsers that throttle rAF on a backgrounded/restored tab.
  function settle(){
    var done = false;
    function clear(){ if (done) return; done = true; el.classList.remove('theme-boot'); }
    requestAnimationFrame(function(){ requestAnimationFrame(clear); });
    window.addEventListener('load', clear, { once: true });
  }
  function apply(){
    // Suppress theme-sensitive transitions while (re)stamping the theme so pills,
    // cards, etc. never animate a dark->light flip — the residual Safari flash on
    // tab return / bfcache restore, where the snapshot repaints before the token
    // override settles. Removed again on the next committed paint.
    el.classList.add('theme-boot');
    try {
      var m = localStorage.getItem('zimi_app_theme') || 'auto';
      var dark = m === 'dark' || (m !== 'light' && !(window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches));
      var t = dark ? 'dark' : 'light';
      el.setAttribute('data-theme', t);
      el.style.colorScheme = t;
    } catch(e) {
      el.setAttribute('data-theme', 'dark');
      el.style.colorScheme = 'dark';
    }
    settle();
  }
  apply();
  // Booting straight into the almanac (#almanac in the URL): stamp a class
  // synchronously, before the first paint, so the home/library view is never
  // visible first — CSS hides #main-view and shows the dark almanac shell
  // until almanac.js takes over and removes the class (_openAlmanacInner).
  if (location.hash === '#almanac') el.classList.add('almanac-boot');
  // Same contract for the Create page (#create): a URL you can send someone
  // has to LAND on that page, not show the library and then swap. The class
  // holds the library back until create.js takes over (_openCreateInner).
  if (location.hash === '#create') el.classList.add('create-boot');
  window.addEventListener('pageshow', function(e){ if (e.persisted) apply(); });
})();
</script>

  <!-- Create a ZIM. Home view only, and only for an admin — it writes to the

  <!-- Reader-specific controls cluster to the right of the app-wide icons.
       Order within the reader cluster: Reader View, font size, read-aloud, save.
       The pop-out (open-external) is ALWAYS the farthest-right functional icon;
       the ⋯ overflow sits just before it (hidden on desktop, so pop-out is the
       true rightmost there; on mobile the reader controls + pop-out live inside
       the ⋯ menu, making ⋯ the rightmost). (W1.8) -->

  <button id="save-btn" class="newtab-btn" style="display:none" title="Save to disk" data-i18n-title="save_to_disk" aria-label="Save to disk" data-i18n-aria="save_to_disk" onclick="_saveCurrentFile()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
  <button class="topbar-more" onclick="_toggleTopbarMenu(event)" aria-label="More" data-i18n-aria="more"><span aria-hidden="true">&#x22EF;</span></button>
  <a id="newtab-btn" class="newtab-btn" href="#" target="_blank" rel="noopener" title="Open in browser" data-i18n-title="open_in_browser" aria-label="Open in browser" data-i18n-aria="open_in_browser" onclick="event.preventDefault();_openInBrowser()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>
  <div id="topbar-menu" class="topbar-menu"></div>
  <div id="reader-palette" class="reader-palette" role="dialog" aria-label="Reader View settings" data-i18n-aria="reader_view_settings"></div>

</nav>

<div id="history-panel" class="history-panel"></div>

<!-- No backdrop-click dismiss: closing cancels login and bounces to home,
     and on a zoomed-in phone almost every stray tap lands on the backdrop.
     Cancel and Esc remain the explicit ways out. -->
<div id="pw-overlay" class="pw-overlay" role="dialog" aria-modal="true" aria-labelledby="pw-title">
  <form class="pw-box" onsubmit="event.preventDefault();submitPw()">
    <h3 id="pw-title" data-i18n="enter_password">Enter password</h3>
    <!-- Optional username (v1.8): purely optional identifier, not a secret.
         When the server has no username configured it accepts any value (the
         "admin" prefill just gives password managers / iCloud Keychain a
         username field with autocomplete="username" to key a credential on).
         When ZIMI_MANAGE_USER (or a stored username) IS set, this must match.
         Do NOT add autocomplete="off" here or on the form: that suppresses the
         save-password prompt. -->
    <label for="pw-username" class="sr-only" data-i18n="username">Username</label>
    <input id="pw-username" type="text" name="username" value="admin" autocomplete="username" placeholder="Username" data-i18n-placeholder="username" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('pw-input').focus()}">
    <!-- First-login hint: shown only when the default username applies (server
         flag via /whoami). Tells a fresh user the account name is "admin". -->
    <div id="pw-username-hint" style="display:none;font-size:12px;color:var(--text2);margin:-4px 0 8px"></div>
    <label for="pw-input" class="sr-only" data-i18n="password">Password</label>
    <input id="pw-input" type="password" placeholder="Password" data-i18n-placeholder="password" autocomplete="current-password" aria-labelledby="pw-title" onkeydown="if(event.key==='Enter'){event.preventDefault();submitPw()}">
    <div class="pw-error" id="pw-error"></div>
    <label id="pw-remember-row" style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--text2);cursor:pointer">
      <input type="checkbox" id="pw-remember" checked style="accent-color:var(--amber);flex-shrink:0"> <span data-i18n="remember_me">Remember me</span>
    </label>
    <div class="pw-actions">
      <button type="button" id="pw-remove-btn" onclick="_confirmRemovePassword(this)" style="display:none;color:var(--text2);font-size:12px;margin-right:auto" data-i18n="remove">Remove</button>
      <button type="button" id="pw-cancel" onclick="closePwModal()" data-i18n="cancel">Cancel</button>
      <button type="submit" class="pw-primary" data-i18n="ok">OK</button>
    </div>
  </form>
</div>

<!-- Desktop: Onboarding overlay (first-run) -->
<div id="desktop-onboarding" class="desktop-overlay" onclick="if(event.target===this)return">
  <div class="desktop-card">
    <h2 data-i18n="welcome">Welcome to Zimi</h2>
    <p class="subtitle" data-i18n="choose_folder_hint">Choose where to keep your offline knowledge archives.</p>
    <p class="subtitle" style="font-size:11px;opacity:0.5;margin-top:-16px;margin-bottom:24px" data-i18n="large_files_hint">ZIM files can be large (Wikipedia is ~100 GB) — pick a drive with plenty of space.</p>
    <label for="onboard-path" data-i18n="zim_folder">ZIM folder</label>
    <div class="field-row">
      <input type="text" id="onboard-path" readonly placeholder="Choose a folder..." data-i18n-placeholder="choose_folder_placeholder">
      <button class="btn-browse" onclick="desktopChooseFolder('onboard-path')" data-i18n="choose_folder">Choose Folder</button>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="onboard-start" onclick="desktopFinishOnboarding()" disabled data-i18n="get_started">Get Started</button>
    </div>
  </div>
</div>

<noscript>
  <div style="max-width:520px;margin:40px auto;padding:20px;text-align:center;color:#e8e8ed">
    <h1 style="font-size:20px;margin-bottom:8px">Zimi</h1>
    <p>Zimi requires JavaScript to browse your offline knowledge library.</p>
    <p style="margin-top:8px;opacity:0.6;font-size:13px">The API endpoints (/search, /read, /list) work without JS.</p>
  </div>
</noscript>

<main id="main-view">
  <div class="container">
    <div id="stats-bar" class="stats-bar"></div>
    <div id="pills-bar" class="pills"></div>
    <div id="source-header" style="display:none"></div>
    <div class="meta" id="search-meta" style="display:none">
      <span class="count" id="search-count"></span>
      <span class="time" id="search-time"></span>
    </div>
    <div id="output"></div>
  </div>
  <footer id="footer" class="footer" style="display:none">
    <a href="https://github.com/epheterson/Zimi" target="_blank" rel="noopener" class="footer-brand">Zimi</a> <span id="footer-version"></span>&middot; <span data-i18n="powered_by">Powered by</span> <a href="https://kiwix.org" target="_blank" rel="noopener">Kiwix</a>
    <div class="footer-sub"><span class="kbd-hints"><kbd>/</kbd> <span data-i18n="kbd_search">Search</span> &middot; <kbd>R</kbd> <span data-i18n="kbd_random">Random</span> &middot; <kbd>B</kbd> <span data-i18n="kbd_bookmark">Bookmark</span> &middot; <kbd>H</kbd> <span data-i18n="kbd_history">History</span> &middot; <kbd>Esc</kbd> <span data-i18n="kbd_back">Back</span></span></div>
  </footer>
</main>

<div id="reader" class="reader-view">
  <div class="reader-loading" id="reader-loading"><div class="spinner"></div><span data-i18n="loading">Loading...</span></div>
  <iframe id="reader-frame" title="Article content" data-i18n-title="article_content" sandbox="allow-same-origin allow-scripts allow-popups allow-downloads"></iframe>
</div>
<div id="almanac-view" class="almanac-view">
  <div class="almanac-content" id="almanac-content"></div>
</div>
<!-- Create a ZIM (create.js, lazy-loaded on first open) — same shell shape as
     the Almanac: an empty surface the module renders into. -->
<div id="create-view" class="create-view">
  <div class="create-content" id="create-content"></div>
</div>
<div id="zim-ctx-menu"></div>
<div id="link-ctx-menu" class="zimi-ctx"></div>
<div id="define-popover" class="define-popover" role="dialog" aria-label="Word lookup"></div>

<div id="a11y-toast-region" role="status" aria-live="polite" class="sr-only"></div>

<script>var __ZIMI_CONFIG = {discoverStamp:'disc6',i18nHash:'0'};</script>
<script src="/static/app.js?v=1"></script>
</body>
</html>
