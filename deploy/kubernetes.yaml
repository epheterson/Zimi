# Zimi on Kubernetes — a complete, working starting point.
#
#   kubectl apply -f deploy/kubernetes.yaml
#
# Then load ZIMs into the zimi-library volume and reach the service. Everything
# below is one namespace, one Deployment, one Service, two volumes.
#
# READ THIS FIRST, it decides whether Kubernetes is the right home for your
# instance: a clustered Zimi cannot do LAN peer discovery or BitTorrent
# seeding. Both need to see a real LAN, and pod networking does not give them
# one. Downloads over plain HTTP work fine, and so does everything a reader
# touches. If sharing ZIMs peer-to-peer is why you run Zimi, run it on a host
# with host networking (see deploy/docker-compose.yml) rather than here.
#
# Single replica, deliberately. Zimi keeps its state on a filesystem, not in a
# database, and two replicas writing the same volume would corrupt the search
# indexes. Scale by giving the pod more CPU, not by adding pods.
---
apiVersion: v1
kind: Namespace
metadata:
  name: zimi
---
# The ZIM library. ReadWriteOnce here because the default is a single node;
# if your storage class supports ReadOnlyMany and you manage the ZIM files
# yourself, that is a better fit and lets you share one library across
# namespaces. Size it for your library plus room to grow: a full English
# Wikipedia with images is ~100GB, and people rarely stop at one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zimi-library
  namespace: zimi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
# Everything Zimi writes. Small, but it is the volume that actually matters:
# the ZIMs are re-downloadable and this is not. Back it up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zimi-config
  namespace: zimi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zimi
  namespace: zimi
  labels:
    app.kubernetes.io/name: zimi
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the two pods of a rolling update would both
  # hold the same ReadWriteOnce volumes, and the new one would sit Pending
  # forever while the old one refused to die.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zimi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zimi
    spec:
      securityContext:
        # Matches the uid the image creates and chowns /config to.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: zimi
          image: epheterson/zimi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8899
          env:
            - name: ZIM_DIR
              value: /zims
            - name: ZIMI_DATA_DIR
              value: /config
            - name: ZIMI_MANAGE
              value: "1"
            # BitTorrent cannot work usefully in a cluster (see the note at the
            # top), and leaving it on means pointless DHT traffic plus a
            # boot-time lookup against library.kiwix.org. Off is correct here.
            - name: ZIMI_TORRENT
              value: "0"
          volumeMounts:
            - name: library
              mountPath: /zims
              readOnly: true
            - name: config
              mountPath: /config
          # Three probes, and the distinction between them is what keeps a
          # cold start from turning into a crash loop.
          #
          # startupProbe carries the cold start: the first boot builds SQLite
          # title indexes for every ZIM, which for a large library is minutes,
          # not seconds. 60 failures at 10s buys ten minutes before Kubernetes
          # gives up. The other two probes do not run until this one passes,
          # which is exactly why it exists.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          # readinessProbe takes the pod out of the Service if it stops
          # answering, without killing it.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # livenessProbe restarts a genuinely wedged process. Generous
          # thresholds on purpose: a slow answer under heavy search load is
          # not a reason to kill a server holding warm indexes.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Search and index building are CPU-bound and libzim memory-maps
              # aggressively. A large library wants more than this; treat these
              # as a floor you raise, not a ceiling you trust.
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: zimi-library
        - name: config
          persistentVolumeClaim:
            claimName: zimi-config
---
apiVersion: v1
kind: Service
metadata:
  name: zimi
  namespace: zimi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zimi
  ports:
    - name: http
      port: 80
      targetPort: http
