[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zimi"
version = "1.9.4"
description = "Offline knowledge server for ZIM files — search and read Wikipedia, Stack Overflow and 50+ sources with no internet"
readme = "README.md"
license = {text = "MIT"}
# Matches libzim, which is not optional and is the real constraint: it
# publishes >=3.10,<3.15. mcp wants >=3.10 too, and the package itself uses
# `X | Y` type syntax in fifteen places, which is 3.10 and up.
#
# It used to claim >=3.9, which was never true. A 3.9 user did not get a clean
# "needs a newer Python" — they got a dependency resolver failing on something
# else entirely, and so did any tool resolving across the declared range (uv
# could not build an environment for this project at all).
requires-python = ">=3.10,<3.15"
authors = [{name = "Eric Pheterson"}]
keywords = ["zim", "kiwix", "offline", "wikipedia", "search", "knowledge-base", "rag", "mcp", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "libzim>=3.1.0",
    "certifi>=2024.1.1",
    # LAN peer discovery (mDNS/Zeroconf). Pure-Python; the peer ZIM-sharing
    # transport runs over plain HTTP so it needs no extra binary.
    "zeroconf>=0.130.0",
    # BitTorrent accelerator: attempted at install, optional at runtime.
    #
    # libtorrent publishes NO sdist. So on any platform where a wheel is
    # missing, pip finds no distribution at all and fails the WHOLE install
    # rather than skipping an optional accelerator — which would break the
    # HTTP soft-fallback contract in the loudest possible way. The marker
    # therefore has to name exactly where wheels exist, on both axes:
    #
    #   Python   CPython 3.9-3.13. No 3.14 wheel yet; this one will age out.
    #   Machine  x86_64 and 64-bit ARM (manylinux + musllinux, so glibc AND
    #            Alpine), macOS on both, and Windows. There has never been an
    #            armv7l build, which is what plain 32-bit Raspberry Pi OS
    #            still installs — not an exotic platform for a project about
    #            offline boxes in cupboards, and `pip install zimi` used to
    #            fail outright there.
    #
    # Where it is skipped, Zimi runs HTTP-only and the Sharing pane says which
    # of the two reasons applies. Force it anywhere with `pip install zimi[bt]`.
    """libtorrent==2.0.*; python_version < '3.14' \
       and (platform_machine == 'x86_64' or platform_machine == 'AMD64' \
            or platform_machine == 'aarch64' or platform_machine == 'arm64' \
            or platform_machine == 'x86')""",
]

[project.optional-dependencies]
bt = ["libtorrent==2.0.*"]
pdf = ["PyMuPDF>=1.23.0"]
# <2.0 for the same reason requirements.txt pins it: mcp 2.0 dropped the
# vendored FastMCP this server is built on, moving it to a separate `fastmcp`
# distribution. Without the ceiling, `pip install zimi[mcp]` resolves to 2.x and
# the MCP server refuses to start -- issue #52, which was fixed in
# requirements.txt and missed HERE, where PyPI users actually get their pins.
mcp = ["mcp>=1.0,<2.0"]
# The rendered capture engine (zimi/renderer.py): a headless Chromium run as a
# CHILD PROCESS of the server, for pages whose content is built in JavaScript.
# Deliberately not in `all`: this package is only half the install — the browser
# itself is another ~150MB fetched by `playwright install chromium` — and a
# browser is not something anybody should acquire by asking for "everything".
# The Docker image ships both. Without it, `--engine rendered` refuses with the
# two commands that fix it and every other capture works untouched.
browser = ["playwright>=1.40"]
all = ["PyMuPDF>=1.23.0", "mcp>=1.0,<2.0", "libtorrent==2.0.*"]

[project.scripts]
zimi = "zimi.server:main"

[project.urls]
Homepage = "https://github.com/epheterson/Zimi"
Repository = "https://github.com/epheterson/Zimi"
Issues = "https://github.com/epheterson/Zimi/issues"
Changelog = "https://github.com/epheterson/Zimi/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["zimi*"]

[tool.setuptools.package-data]
zimi = ["templates/**", "static/**", "assets/**"]

[tool.pytest.ini_options]
# test_article_languages is a data-integrity suite — it asserts against real
# Wikipedia interwiki links in the ZIMs on disk. Wikipedia's link graph drifts
# over time, so failures there are signal about ZIM data, not code.
# Run it explicitly with `pytest tests/test_article_languages.py` when needed.
addopts = "--ignore=tests/test_article_languages.py"
# tests_release/ is the pre-release gate (scripts/release-gate.sh): it boots
# real servers and takes minutes, so a bare `pytest` must not pick it up.
# Naming it explicitly still runs it.
testpaths = ["tests"]
markers = [
    "real_engine: opts a test out of the autouse libtorrent guard (may start a live libtorrent session)",
]
