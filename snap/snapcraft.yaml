name: zimi
# A base is a glibc. core22 is glibc 2.35, and `parts` below dumps a
# PyInstaller bundle built by .github/workflows/desktop-release.yml — so that
# workflow's Linux runner is PINNED to ubuntu-22.04 to match. Building on
# anything newer produces a binary that needs symbols this base does not have,
# and the snap dies at launch with `libm.so.6: version GLIBC_2.38 not found`
# (issue #55). Move the two together or not at all.
base: core22
version: '1.7.1'
summary: Offline knowledge server for ZIM files
description: |
  Search and read 100M+ articles offline. Wikipedia, Stack Overflow,
  dev docs, and thousands more — all on your machine.
grade: stable
confinement: strict

apps:
  zimi:
    command: Zimi
    # The GNOME extension brings GTK 3 and WebKitGTK (4.0 and 4.1) into a
    # strictly confined snap through the gnome-42-2204 platform snap, and
    # wires the desktop interfaces a window needs. Without it the snap had
    # no display access and no WebKit at all (issue #81), and the app died
    # on launch on every machine.
    extensions: [gnome]
    plugs: [network, network-bind, home, removable-media, desktop, desktop-legacy, x11, wayland, opengl]

parts:
  zimi:
    plugin: dump
    source: dist/Zimi/
