# Weekly version updates, grouped so a quiet week is one pull request per ecosystem.
# Security updates are separate: they arrive as soon as an advisory lands (Settings > Code security).
version: 2

updates:
  # The server's pinned requirements (also what the Docker image installs) and the desktop
  # app's. pyproject.toml carries the ranges PyPI users get; pip updates it alongside.
  - package-ecosystem: pip
    directories:
      - /
      - /desktop
      - /packaging/zimi-mcp
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      python-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Base image of the published container.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    ignore:
      # A Python version is a deliberate move: CI, the Dockerfile and the builds name it together.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Every action is pinned to a commit; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
