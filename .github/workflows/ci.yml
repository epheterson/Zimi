name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `mcp` too, so the MCP tests RUN rather than skip. They were skipping
      # invisibly — which is the same failure as not having them, and this
      # install line is also the only place CI exercises the extras a PyPI user
      # actually resolves. It caught `mcp = ["mcp>=1.0.0"]` in pyproject having
      # no upper bound while requirements.txt correctly pinned <2.0: anyone
      # running `pip install zimi[mcp]` got mcp 2.x, which dropped the vendored
      # FastMCP, and their MCP server refused to start.
      - name: Install package
        run: pip install -e ".[pdf,mcp]" pytest

      # A real browser, so the paint gate actually runs somewhere.
      #
      # tests/test_reader_paints.py opens a made ZIM, scrolls it end to end and
      # asks every image whether it decoded. That check exists because a
      # capture passed every byte-level assertion in this suite — entries
      # present, hrefs resolving, counts right — and still looked broken to a
      # reader. Without chromium here it skips, and a gate that skips
      # everywhere is not a gate.
      - name: Install chromium for the paint gate
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # THE WHOLE SUITE. This used to name two files, which collected 305 of
      # 2469 tests — so 88% of the suite only ran when somebody remembered to
      # run it by hand, and a green tick here meant almost nothing.
      #
      # That is not theoretical. Six tests were failing on this branch for two
      # days: two of them had caught real bugs, including one that silently ran
      # the wrong capture engine. Every one was a test that already existed,
      # was already correct, and that nothing was running.
      #
      # Tests needing a browser or a sidecar are `pytest.mark.skipif`, so they
      # skip cleanly here instead of failing. -q because 2469 lines of -v is
      # not something anybody reads.
      - name: Run the test suite
        run: python -m pytest tests/ -q

      # Standalone node tests (vm-extracted client logic). They are not
      # collected by pytest, so without this step they only ever run by hand
      # and rot silently.
      - name: Run standalone JS tests
        run: |
          for f in tests/*.cjs; do
            echo "--- $f"
            node "$f"
          done

      # The hook only protects a clone that has run `git config core.hooksPath
      # .githooks`. This is the backstop for one that has not.
      - name: No session links in commit messages
        if: github.event_name == 'pull_request'
        run: |
          if git log --format='%H%n%B' \
               "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" \
               | grep -n 'claude\.ai'; then
            echo "::error::a commit message on this branch carries a Claude session link"
            exit 1
          fi
          echo "no session links"

      - name: Verify CLI entry point
        run: zimi --help

      - name: Verify python -m zimi
        run: python -m zimi --help

      - name: Verify package build
        run: |
          pip install build
          python -m build
          # Check wheel contains data files
          python -c "
          import zipfile, sys
          whl = [f for f in __import__('glob').glob('dist/*.whl')][0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              assert any('templates/index.html' in n for n in names), 'Missing templates'
              assert any('static/pdfjs' in n for n in names), 'Missing static/pdfjs'
              assert any('assets/icon.png' in n for n in names), 'Missing assets'
              print(f'Wheel OK: {len(names)} files')
          "

  # The environment the DESKTOP release builds in, on every pull request, on
  # every runner it builds on.
  #
  # This job exists because 1.9.0 was tagged twice and Desktop Release failed
  # both times, on failures a pull request had no way to see: Desktop Release
  # fires only on a tag, and it is the only thing that installs the desktop
  # dependency set or runs the suite anywhere but ubuntu-latest.
  #
  # It was first written as ONE ubuntu-latest job, which was still an
  # approximation of the gate rather than the gate, and the next tag proved it:
  # the release's Linux leg is pinned to ubuntu-22.04 (see the comment on that
  # pin in desktop-release.yml) where an apt package has a different name, and
  # the Windows and macOS suites had not run since 1.8.2. An approximate gate
  # finds approximate problems.
  #
  # So the matrix here is the release's matrix. When one changes, both change:
  # tests/test_ci_contract.py fails if the runner lists drift apart.
  #
  # Deliberately NOT `pip install -e .[pdf,mcp]`: the point is the desktop
  # requirements exactly as the release installs them, plus libtorrent, which
  # is bundled there and nowhere else in CI.
  desktop-env:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same system libraries the release build installs on Linux: the
      # bundle links GTK and WebKit through PyGObject, and PyInstaller
      # collects what is present at build time.
      #
      # The package is libgirepository1.0-dev on 22.04 and libgirepository-2.0-dev
      # from 24.04 on. The release pins 22.04 for the snap base, so name both and
      # take whichever this runner has, rather than encoding a name that goes
      # stale the next time the pin moves.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            gcc libcairo2-dev pkg-config python3-dev
          sudo apt-get install -y libgirepository-2.0-dev \
            || sudo apt-get install -y libgirepository1.0-dev

      - name: Install desktop dependencies
        run: pip install -r desktop/requirements-desktop.txt pytest

      - name: Install libtorrent (in-process BT engine)
        shell: bash
        run: |
          # Soft dependency, exactly as the release treats it: no wheel for this
          # platform means the build ships HTTP-only, never that it fails.
          pip install "libtorrent==2.0.*" || echo "::warning::no libtorrent wheel for this platform"

      # Pinned below 3.52, which is where PyGObject started requiring
      # girepository-2.0 — a library that does not exist on 22.04 at any
      # package name. This runner is pinned to 22.04 for the snap base, so an
      # unpinned install resolves to a version that cannot build here.
      - name: Install PyGObject (Linux)
        if: runner.os == 'Linux'
        run: pip install "PyGObject<3.52"

      # -v, not -q, and the reason is specific: a hard interpreter crash prints
      # no failure summary at all. The Windows leg of the 1.9.0 tag died at 30%
      # of the suite with nothing but an exit code, and the only way to know
      # which test was running is to have streamed its name before it ran.
      - name: Run the test suite as the desktop build runs it
        run: python -m pytest tests/ -v -rf --tb=short

      # PyInstaller on the runner the AppImage and snap are actually built on.
      # This catches a bundle that stops building at all, which is the other
      # way Desktop Release fails after a merge rather than before it.
      - name: Build with PyInstaller
        if: matrix.os == 'ubuntu-22.04'
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm desktop/zimi_desktop.spec

      # The same script the release runs, in the same headless server mode.
      # The bundle opens a window without it, and there is no display here.
      - name: The built binary starts and answers
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          SMOKE_EXPECT_BT: '1'
        run: ci/smoke_binary.sh "dist/Zimi/Zimi"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start Docker
        run: |
          mkdir -p zims
          docker compose up -d --build

          # Wait for the server, and SAY SO if it never arrives.
          #
          # This waited 60s and then fell through regardless, so a server that
          # was still booting produced a JSONDecodeError from the smoke test's
          # `json.load` on an empty body — a stack trace about JSON for a
          # problem that was nothing to do with JSON. The image grew Node and
          # Playwright, boot passed 60s, and that is exactly what happened on
          # the first run.
          #
          # Longer budget, and on expiry it prints the container's own logs and
          # fails here, where the message can name the actual problem.
          for i in $(seq 1 180); do
            if curl -sf http://localhost:8899/health > /dev/null 2>&1; then
              echo "  server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not answer /health within 180s"
          docker compose ps
          docker compose logs --tail 80
          exit 1

      - name: Smoke test Docker
        run: |
          echo "Testing /health..."
          curl -sf http://localhost:8899/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Bad status: {d}'
          print(f'  OK: v{d[\"version\"]}')
          "

          echo "Testing / (web UI)..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8899/)
          [ "$STATUS" = "200" ] && echo "  OK" || { echo "FAIL: $STATUS"; exit 1; }

          echo "Testing /static/pdfjs/web/viewer.html..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8899/static/pdfjs/web/viewer.html)
          [ "$STATUS" = "200" ] && echo "  OK" || { echo "FAIL: $STATUS"; exit 1; }

          echo "All Docker smoke tests passed!"

      - name: Cleanup
        if: always()
        run: docker compose down
