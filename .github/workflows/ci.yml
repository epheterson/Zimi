name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `mcp` too, so the MCP tests RUN rather than skip. They were skipping
      # invisibly — which is the same failure as not having them, and this
      # install line is also the only place CI exercises the extras a PyPI user
      # actually resolves. It caught `mcp = ["mcp>=1.0.0"]` in pyproject having
      # no upper bound while requirements.txt correctly pinned <2.0: anyone
      # running `pip install zimi[mcp]` got mcp 2.x, which dropped the vendored
      # FastMCP, and their MCP server refused to start.
      - name: Install package
        run: pip install -e ".[pdf,mcp]" pytest

      # A real browser, so the paint gate actually runs somewhere.
      #
      # tests/test_reader_paints.py opens a made ZIM, scrolls it end to end and
      # asks every image whether it decoded. That check exists because a
      # capture passed every byte-level assertion in this suite — entries
      # present, hrefs resolving, counts right — and still looked broken to a
      # reader. Without chromium here it skips, and a gate that skips
      # everywhere is not a gate.
      - name: Install chromium for the paint gate
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # THE WHOLE SUITE. This used to name two files, which collected 305 of
      # 2469 tests — so 88% of the suite only ran when somebody remembered to
      # run it by hand, and a green tick here meant almost nothing.
      #
      # That is not theoretical. Six tests were failing on this branch for two
      # days: two of them had caught real bugs, including one that silently ran
      # the wrong capture engine. Every one was a test that already existed,
      # was already correct, and that nothing was running.
      #
      # Tests needing a browser or a sidecar are `pytest.mark.skipif`, so they
      # skip cleanly here instead of failing. -q because 2469 lines of -v is
      # not something anybody reads.
      - name: Run the test suite
        run: python -m pytest tests/ -q

      # Standalone node tests (vm-extracted client logic). They are not
      # collected by pytest, so without this step they only ever run by hand
      # and rot silently.
      - name: Run standalone JS tests
        run: |
          for f in tests/*.cjs; do
            echo "--- $f"
            node "$f"
          done

      - name: Verify CLI entry point
        run: zimi --help

      - name: Verify python -m zimi
        run: python -m zimi --help

      - name: Verify package build
        run: |
          pip install build
          python -m build
          # Check wheel contains data files
          python -c "
          import zipfile, sys
          whl = [f for f in __import__('glob').glob('dist/*.whl')][0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              assert any('templates/index.html' in n for n in names), 'Missing templates'
              assert any('static/pdfjs' in n for n in names), 'Missing static/pdfjs'
              assert any('assets/icon.png' in n for n in names), 'Missing assets'
              print(f'Wheel OK: {len(names)} files')
          "

  # The environment the DESKTOP release builds in, on every pull request.
  #
  # 1.9.0 was tagged, and its desktop build then failed on all four runners at
  # this exact step: the suite had never run in this dependency set, because
  # Desktop Release only fires on a tag and the step was added after the last
  # one. Nothing was wrong with the code the `test` job installs; three tests
  # needed an extra this environment does not have, and every test that boots
  # a server timed out. Finding that after the tag is finding it too late.
  #
  # Deliberately NOT `pip install -e .[pdf,mcp]`: the point is the desktop
  # requirements exactly as the release builds them, plus libtorrent, which is
  # bundled there and nowhere else in CI.
  desktop-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: |
          pip install -r desktop/requirements-desktop.txt pytest
          pip install "libtorrent==2.0.*" || echo "::warning::no libtorrent wheel here"

      - name: Run the test suite as the desktop build runs it
        run: python -m pytest tests/ -q

      # PyInstaller on one platform. The four-platform matrix stays on the tag;
      # this is here to catch a bundle that stops building at all, which is the
      # other way Desktop Release fails after a merge rather than before it.
      - name: Build with PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm desktop/zimi_desktop.spec

      - name: The built binary starts and answers
        shell: bash
        run: |
          BIN=$(find dist -maxdepth 2 -type f -perm -u+x -name 'Zimi*' | head -1)
          test -n "$BIN" || { echo "no binary in dist/"; ls -R dist | head -40; exit 1; }
          "$BIN" --port 0 > /tmp/zimi-boot.log 2>&1 &
          for i in $(seq 1 30); do
            PORT=$(sed -n 's/^READY \([0-9]*\).*/\1/p' /tmp/zimi-boot.log | head -1)
            [ -n "$PORT" ] && break
            sleep 1
          done
          test -n "$PORT" || { echo "no READY within 30s"; cat /tmp/zimi-boot.log; exit 1; }
          curl -fsS "http://127.0.0.1:$PORT/health" | head -c 200; echo
          kill %1 || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start Docker
        run: |
          mkdir -p zims
          docker compose up -d --build

          # Wait for the server, and SAY SO if it never arrives.
          #
          # This waited 60s and then fell through regardless, so a server that
          # was still booting produced a JSONDecodeError from the smoke test's
          # `json.load` on an empty body — a stack trace about JSON for a
          # problem that was nothing to do with JSON. The image grew Node and
          # Playwright, boot passed 60s, and that is exactly what happened on
          # the first run.
          #
          # Longer budget, and on expiry it prints the container's own logs and
          # fails here, where the message can name the actual problem.
          for i in $(seq 1 180); do
            if curl -sf http://localhost:8899/health > /dev/null 2>&1; then
              echo "  server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not answer /health within 180s"
          docker compose ps
          docker compose logs --tail 80
          exit 1

      - name: Smoke test Docker
        run: |
          echo "Testing /health..."
          curl -sf http://localhost:8899/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Bad status: {d}'
          print(f'  OK: v{d[\"version\"]}')
          "

          echo "Testing / (web UI)..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8899/)
          [ "$STATUS" = "200" ] && echo "  OK" || { echo "FAIL: $STATUS"; exit 1; }

          echo "Testing /static/pdfjs/web/viewer.html..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8899/static/pdfjs/web/viewer.html)
          [ "$STATUS" = "200" ] && echo "  OK" || { echo "FAIL: $STATUS"; exit 1; }

          echo "All Docker smoke tests passed!"

      - name: Cleanup
        if: always()
        run: docker compose down
