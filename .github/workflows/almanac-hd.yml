name: Almanac HD tile source

# Makes a NEW tile source: scripts/build_almanac_hd.py (NASA's Earth and Moon as tile pyramids, planets, the Apollo sites;
# about an hour of downloads) and attaches the ZIM to a release that already exists. Rare: when NASA reissues an image or
# a body is added. Not part of a release.
#
# The tile source is the immutable input of every release's HD flavour (scripts/build_almanac_maxi.py, run by
# desktop-release.yml): zimi/assets/almanac-tiles.json pins its file, size, sha256 and the release that carries it. To
# publish a new one:
#   1. Run this workflow with the tag of an existing release.
#   2. Copy the pin it prints (the job summary, and the almanac-tiles-pin artifact) into zimi/assets/almanac-tiles.json
#      and commit it. The next release builds its HD flavour from the new tiles.
# It never creates or moves a tag, and nothing here is needed to release Zimi.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release to attach the file to (e.g. v1.15.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt "Pillow>=13.0.0" numpy scipy

      - name: Build the tiles and the tile source ZIM
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/build_almanac_hd.py --out dist --tag "$TAG"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/zimi_almanac_hd_*.zim --clobber

      - name: Print the pin to commit
        run: |
          {
            echo "Commit this as zimi/assets/almanac-tiles.json:"
            echo '```json'
            cat zimi/assets/almanac-tiles.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: almanac-tiles-pin
          path: zimi/assets/almanac-tiles.json
