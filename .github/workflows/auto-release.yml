name: Auto Release

# ── Release flow ─────────────────────────────────────────────────────────
# When a push to main changes the version in pyproject.toml:
#   1. this workflow tags vX.Y.Z, and nothing else;
#   2. the tag push triggers desktop-release.yml, which builds every platform
#      and then makes the draft release, its notes from CHANGELOG.md
#      (scripts/release_notes.py), with every file already attached. The draft
#      used to be made here, at merge, and sat empty for the half hour of
#      builds, and was published that way more than once;
#   3. the maintainer reviews the draft and publishes it;
#   4. publish-release.yml then ships PyPI, the snap, the update feeds the
#      apps read and the Homebrew cask.

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'

# Read-only by default; create-tag asks for the write it needs, job-level.
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          CURRENT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PREVIOUS=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "")
          echo "current=$CURRENT previous=$PREVIOUS"
          if [ "$CURRENT" != "$PREVIOUS" ] && [ -n "$CURRENT" ]; then
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  create-tag:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
