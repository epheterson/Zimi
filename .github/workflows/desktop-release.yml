name: Desktop Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.3.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PINNED, and it must stay pinned. This job builds a PyInstaller
          # bundle that snap/snapcraft.yaml then `dump`s into a snap declaring
          # `base: core22` — and a base IS a glibc. core22 is glibc 2.35, so a
          # binary linked on anything newer resolves symbols the base cannot
          # provide. `ubuntu-latest` floated to 24.04 (glibc 2.39) and the snap
          # started dying on launch with
          #   libm.so.6: version `GLIBC_2.38' not found
          # for everyone who installed it (issue #55, reported against 1.8.2 on
          # Ubuntu 26 — the user's own glibc is irrelevant, the base's is what
          # the binary gets). Nothing in the build failed; the artifact was
          # simply unrunnable.
          #
          # The AppImage from this same job wants an old host for its own
          # reason: it links against the build machine's glibc and a newer one
          # narrows the systems it runs on. Both artifacts want the oldest
          # supported runner, so pinning serves them together.
          #
          # If this runner is retired, move it and `base:` in the SAME commit.
          - os: ubuntu-22.04
            artifact: Zimi-Linux-amd64
            asset: Zimi-Linux-amd64.AppImage
          - os: macos-15-intel
            artifact: Zimi-Intel
            asset: Zimi-Intel.dmg
          - os: macos-latest
            artifact: Zimi-AppleSilicon
            asset: Zimi-AppleSilicon.dmg
          - os: windows-latest
            artifact: Zimi-windows-x64
            asset: Zimi-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # libgirepository is libgirepository1.0-dev on 22.04 and
      # libgirepository-2.0-dev from 24.04 on. This job's runner is pinned to
      # 22.04 for the snap base above, and the 24.04 name was left behind when
      # it moved: every Linux build since has died here, before a single test
      # ran. Name both and take whichever this runner has, so the next time the
      # pin moves this step moves with it.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            gcc libcairo2-dev pkg-config python3-dev
          sudo apt-get install -y libgirepository-2.0-dev \
            || sudo apt-get install -y libgirepository1.0-dev

      - name: Install dependencies
        run: pip install -r desktop/requirements-desktop.txt

      - name: Install libtorrent (in-process BT engine)
        shell: bash
        run: |
          # Soft dependency: no wheel for this platform → the build still
          # ships and runs HTTP-only (soft import). Never block a release
          # on BT bundling.
          pip install "libtorrent==2.0.*" || echo "::warning::no libtorrent wheel for this platform — this build runs HTTP-only"

      # Pinned below 3.52, which is where PyGObject started requiring
      # girepository-2.0 — a library that does not exist on 22.04 at any
      # package name. This runner is pinned to 22.04 for the snap base, so an
      # unpinned install resolves to a version that cannot build here.
      - name: Install PyGObject (Linux)
        if: runner.os == 'Linux'
        run: pip install "PyGObject<3.52"

      - name: Install pytest
        run: pip install pytest

      # ── Pre-build tests ──────────────────────────────────────────────
      #
      # This is a RELEASE gate, so it runs the whole suite.
      #
      # It previously ran two things, and one of them was not a test run at
      # all: `python tests/test_unit.py` imports the module and exits 0 without
      # executing any of its 245 tests, because the file has no
      # `unittest.main()`. That step passed every build it ever gated. The
      # other named a single file out of ~80.
      #
      # Tests needing a browser or a sidecar are `pytest.mark.skipif` and skip
      # cleanly on a runner that lacks them.
      - name: Run the test suite
        run: python -m pytest tests/ -q

      # ── Build ─────────────────────────────────────────────────────────

      - name: Download Sparkle.framework (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 "https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz" -o /tmp/sparkle.tar.xz
          tar -xf /tmp/sparkle.tar.xz -C /tmp
          cp -R /tmp/Sparkle.framework Sparkle.framework
          echo "Sparkle.framework ready ($(du -sh Sparkle.framework | cut -f1))"

      - name: Download WinSparkle.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned WinSparkle release + sha256 (verified in-workflow, same
          # discipline the old aria2 static download used). WinSparkle's EdDSA
          # verification is wire-compatible with Sparkle's sign_update tool, so
          # the release job signs the Windows enclosure with the same key.
          $ver = '0.9.4'
          # Upstream re-uploaded the 0.9.4 zip on 2026-07-23 (distrib.makefile
          # fix adding the missing x86 build — vslavik/winsparkle commit
          # "Really fix distrib.makefile", issue "0.9.4 doesn't contain x86
          # build"). Hash re-verified from an independent download of the
          # re-packaged asset; the x64 DLL layout is unchanged.
          $expected = '6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976'
          $url = "https://github.com/vslavik/winsparkle/releases/download/v$ver/WinSparkle-$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile winsparkle.zip -MaximumRetryCount 5 -RetryIntervalSec 5
          $actual = (Get-FileHash winsparkle.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "WinSparkle sha256 mismatch: expected $expected, got $actual"
            exit 1
          }
          Expand-Archive -Path winsparkle.zip -DestinationPath winsparkle -Force
          Copy-Item "winsparkle/WinSparkle-$ver/x64/Release/WinSparkle.dll" -Destination WinSparkle.dll -Force
          Write-Host "WinSparkle.dll ready ($((Get-Item WinSparkle.dll).Length) bytes)"

      - name: Generate icons
        run: python zimi/assets/generate_icons.py

      - name: Inspect libzim package
        shell: bash
        run: |
          python -c "import libzim; print('libzim OK')"
          python -c "
          import importlib.util, os, sysconfig
          spec = importlib.util.find_spec('libzim')
          print(f'libzim origin: {spec.origin}')
          print(f'submodule_search_locations: {spec.submodule_search_locations}')
          for base in [sysconfig.get_path('purelib'), sysconfig.get_path('platlib')]:
              d = os.path.join(base, 'libzim')
              if os.path.isdir(d):
                  print(f'libzim dir ({d}):')
                  for f in sorted(os.listdir(d)):
                      full = os.path.join(d, f)
                      sz = os.path.getsize(full) if os.path.isfile(full) else '-'
                      print(f'  {f}  ({sz})')
          "

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm desktop/zimi_desktop.spec

      # ── Post-build smoke tests ────────────────────────────────────────

      # Retried launch + full endpoint sweep on every OS — the single-shot
      # 30s wait failed a healthy Apple Silicon build during v1.7.1.
      - name: Smoke test built binary
        shell: bash
        env:
          SMOKE_EXPECT_BT: '1'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ci/smoke_binary.sh "dist/Zimi.app/Contents/MacOS/Zimi"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # windows-latest runners provide git-bash for `shell: bash`.
            # One-dir PyInstaller output is dist/Zimi/Zimi.exe.
            ci/smoke_binary.sh "dist/Zimi/Zimi.exe"
          else
            ci/smoke_binary.sh "dist/Zimi/Zimi"
          fi

      # GUI smoke: the check above only exercises the headless HTTP server, so
      # it never opens a window — that gap let a build ship that crashed at
      # launch (pythonnet couldn't load System.Windows.Forms). windows-latest
      # runners have an interactive desktop + WebView2, so a real EdgeChromium
      # window CAN open. Run the BUILT exe with ZIMI_DESKTOP_SMOKE=1 and demand
      # the "SMOKE: window shown" marker + a clean exit.
      # Not just a window: the bundle is stamped with the mark of the web the
      # way a downloaded zip arrives, a control run proves that kills 1.9.5,
      # then the app must clear the mark itself, start, and render its home
      # view. ci/smoke_windows.ps1 is the same script CI runs on every push.
      - name: GUI smoke test (Windows, marked bundle renders its home view)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh ci/smoke_windows.ps1 dist/Zimi/Zimi.exe

      - name: Upload the Windows smoke screenshot
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: zimi-windows-smoke
          path: |
            zimi-windows-smoke.png
            smoke_*.log
          if-no-files-found: ignore

      # ── Packaging ─────────────────────────────────────────────────────

      # snapd on fresh runners races its own seeding; installing core22 via
      # snapcraft then fails with "Error installing snap 'core22'". Pre-seed
      # it ourselves with retries (took down the v1.7.0 release run, twice).
      # snapcraft.yaml's version went stale for two releases (shipped a snap
      # labeled 1.6.1 during v1.7.0). Derive it from pyproject at build time.
      - name: Sync snap version from pyproject (Linux)
        if: runner.os == 'Linux'
        run: |
          VER=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          sed -i "s/^version: .*/version: '$VER'/" snap/snapcraft.yaml
          grep '^version' snap/snapcraft.yaml

      - name: Build Snap (Linux)
        if: runner.os == 'Linux'
        # In the container snapcraft sets up, not on the runner. Destructive
        # mode made snapcraft install the gnome extension's own snaps onto
        # the runner as a non-root user, and the store refused them one at a
        # time: gnome-42-2204-sdk on the v1.10.0 tag, gtk-common-themes once
        # that was pre-installed by hand. The container is the supported
        # path for an extension, and snapcraft is root inside it.
        #
        # continue-on-error stays: the snap is an extra channel and the
        # store is not ours, and the AppImage is packaged in the step after
        # this one. A snap that will not build must not cost the release its
        # Linux app, which is what happened on the v1.10.0 tag.
        continue-on-error: true
        uses: snapcore/action-build@v1

      # The snap's own window, which nothing ever opened: 1.10.0 shipped a
      # snap that installed and then did nothing at all, silently, because
      # the bundle's environment fixups took apart what the gnome extension
      # had set up (issue #81). Installed and run here the way a person
      # would, so the next one cannot ship untried.
      # A snap that will not open is dropped, not the release: this step
      # comes before the AppImage in the same job, and a failure here once
      # would have skipped every platform's release (the 1.10.0 outage).
      # So it may fail without failing the job, it says so as an error on
      # the run, and the upload below only takes a snap that passed.
      - name: The snap installs and opens its window (Linux)
        id: snap_smoke
        if: runner.os == 'Linux' && hashFiles('*.snap') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -x
          # A desktop session, not a bare display: a session bus with
          # xdg-desktop-portal on it. The 1.10.1 snap passed this check on a
          # bare Xvfb and showed a black window on Xubuntu and Mint, because
          # there the portal refused WebKit's network check (issue #81).
          sudo apt-get install -y -qq xvfb dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk >/dev/null
          sudo snap install --dangerous ./*.snap
          # A sideloaded snap gets no auto-connections: wire what the
          # snapcraft.yaml asks for, and say so when one will not connect.
          for plug in $(snap connections zimi | awk 'NR>1 && $3 == "-" {print $2}'); do
            sudo snap connect "$plug" || echo "could not connect $plug"
          done
          snap connections zimi
          mkdir -p "$HOME/zimi-smoke"
          # A real user session, not dbus-run-session: `snap run` asks the
          # session bus's systemd for a scope, and a bare dbus-run-session
          # bus has none, so snapd refused to start the app at all ("not a
          # snap cgroup"). Lingering gives the runner user its own systemd
          # and session bus, as a desktop login does.
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          # The display first, so the portal's GTK backend can start on it.
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          export XDG_CURRENT_DESKTOP=GNOME
          sleep 2
          # A desktop login hands its display to the services the session
          # bus starts; without this the portal's GTK backend could not open
          # one, and each portal call waited 25 s for it (six of them held
          # WebKit's first page past the time limit).
          dbus-update-activation-environment --systemd DISPLAY XDG_CURRENT_DESKTOP
          /usr/libexec/xdg-desktop-portal >/tmp/portal.log 2>&1 &
          sleep 3
          ZIMI_DESKTOP_SMOKE=app ZIMI_DESKTOP_SMOKE_DWELL=2 ZIM_DIR="$HOME/zimi-smoke" \
            timeout 180 snap run zimi 2>&1 | tee /tmp/snap-smoke.log || true
          grep -i "portal" /tmp/snap-smoke.log /tmp/portal.log || true
          if ! grep -q "SMOKE: app rendered" /tmp/snap-smoke.log; then
            echo "::error::The snap did not open its window; this release ships without it."
            exit 1
          fi

      - name: Upload Snap artifact
        if: steps.snap_smoke.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Zimi-Linux-snap
          path: "*.snap"

      - name: Say what the snap did (Linux)
        if: runner.os == 'Linux' && always()
        run: |
          ls -la *.snap 2>/dev/null || echo "no .snap was built"
          # snapcraft's own log says why, and nothing else prints it.
          for f in ~/.local/state/snapcraft/log/*.log; do
            [ -e "$f" ] || continue
            echo "── $f"
            tail -40 "$f"
          done

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Build AppDir from PyInstaller output
          APPDIR=dist/Zimi.AppDir
          mv dist/Zimi "$APPDIR"

          # Add AppImage metadata
          cp linux/AppRun "$APPDIR/"
          chmod +x "$APPDIR/AppRun"
          cp linux/zimi.desktop "$APPDIR/"
          cp zimi/assets/icon.png "$APPDIR/zimi.png"
          ln -sf zimi.png "$APPDIR/.DirIcon"

          # Download appimagetool
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

          # Build the AppImage (--appimage-extract-and-run avoids FUSE requirement in CI)
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "${{ matrix.asset }}"

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Copy Sparkle.framework into app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          # Must copy AFTER PyInstaller — BUNDLE() overwrites dist/Zimi.app
          FWDIR="dist/Zimi.app/Contents/Frameworks"
          mkdir -p "$FWDIR"
          rm -rf "$FWDIR/Sparkle.framework"
          cp -R Sparkle.framework "$FWDIR/"

          # Remove XPC services — not needed for non-sandboxed apps, and they
          # fail to launch from inside a PyInstaller bundle ("updater failed to start")
          rm -rf "$FWDIR/Sparkle.framework/Versions/B/XPCServices"
          echo "Copied Sparkle.framework (XPC services removed for non-sandboxed app)"
          ls -la "$FWDIR/Sparkle.framework/Versions/Current/Sparkle"

      - name: Code sign app (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Use whatever signing identity is in the keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Signing with: $IDENTITY"

          # Sign Sparkle.framework's nested binaries first
          SPARKLE="dist/Zimi.app/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE" ]; then
            # Sign Autoupdate (XPC service inside Sparkle)
            find "$SPARKLE" -type f \( -name "*.xpc" -o -name "Autoupdate" -o -name "Updater" \) -exec \
              codesign --force --options runtime --sign "$IDENTITY" --timestamp {} \;
            # Sign the framework binary itself
            codesign --force --options runtime --sign "$IDENTITY" --timestamp "$SPARKLE/Versions/Current/Sparkle"
            codesign --force --options runtime --sign "$IDENTITY" --timestamp "$SPARKLE"
          fi

          # Sign all binaries inside the app bundle (incl. the libtorrent
          # extension + its bundled dylibs)
          find dist/Zimi.app -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.pyd" \) -exec \
            codesign --force --options runtime --sign "$IDENTITY" --timestamp {} \;

          # Sign the main executable
          codesign --force --options runtime --sign "$IDENTITY" --timestamp dist/Zimi.app/Contents/MacOS/Zimi

          # Sign the app bundle itself
          codesign --force --deep --options runtime --sign "$IDENTITY" --timestamp dist/Zimi.app

          # Verify
          codesign --verify --deep --strict dist/Zimi.app
          echo "Code signing successful"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: dist
        run: |
          create-dmg \
            --volname "Zimi" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Zimi.app" 150 185 \
            --app-drop-link 450 185 \
            --no-internet-enable \
            ../${{ matrix.asset }} Zimi.app

      - name: Notarize DMG (macOS)
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Submitting for notarization..."
          xcrun notarytool submit ${{ matrix.asset }} \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 10m

          echo "Waiting for notarization ticket to propagate..."
          sleep 15

          echo "Stapling notarization ticket..."
          for i in 1 2 3; do
            xcrun stapler staple ${{ matrix.asset }} && break
            echo "Staple attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Notarization complete"

      - name: Package portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PyInstaller one-dir output is dist/Zimi/ (Zimi.exe + deps). Zip the
          # whole folder so the archive extracts to a self-contained Zimi\ dir —
          # no installer, portable. Compress-Archive ships with the runner.
          Compress-Archive -Path dist/Zimi -DestinationPath ${{ matrix.asset }} -Force

      - name: Build installer (Windows / Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WinSparkle downloads and runs an installer to apply updates (a
          # portable zip can't self-install), so ship a per-user Inno Setup
          # installer as the auto-update enclosure alongside the portable zip.
          # ISCC ships on the windows runner image; install via Chocolatey if not.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $ver = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$ver" windows\zimi.iss
          Write-Host "Built installer: dist/Zimi-windows-x64-Setup.exe"

      # The installer is what most people run and what WinSparkle applies on
      # update, and nothing ever ran it: installed silently here, per-user
      # as a person would get it, and the installed app has to render its
      # home view.
      - name: The installer installs an app that opens (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ZimiInstalled"
          # WaitForExit, not -Wait: -Wait also waits for every process the
          # installer starts, and it relaunches Zimi, which never exits.
          $p = Start-Process -FilePath dist\Zimi-windows-x64-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"","/LOG=installer.log" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Get-Content installer.log -ErrorAction SilentlyContinue | Out-Host; throw "the installer did not finish in 5 minutes" }
          if ($p.ExitCode -ne 0) { Get-Content installer.log | Out-Host; throw "the installer exited $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir "Zimi.exe"))) { Get-Content installer.log | Out-Host; throw "the installer left no Zimi.exe in $dir" }
          # The installer relaunches Zimi even when silent: that is how an
          # auto-update brings the app back (zimi.iss [Run]). It must have,
          # and that copy is stopped so the smoke run below is the only one.
          $relaunched = $null
          for ($i = 0; $i -lt 30 -and -not $relaunched; $i++) { Start-Sleep -Seconds 1; $relaunched = Get-Process -Name Zimi -ErrorAction SilentlyContinue }
          if (-not $relaunched) { throw "the installer did not relaunch Zimi, so an auto-update would leave it closed" }
          $relaunched | Stop-Process -Force
          Start-Sleep -Seconds 3
          pwsh ci/smoke_windows.ps1 -Exe (Join-Path $dir "Zimi.exe") -Installed

      - name: Upload the installed-app smoke screenshot
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: zimi-windows-installed-smoke
          path: |
            zimi-windows-installed-smoke.png
            installer.log
          if-no-files-found: ignore

      - name: Move asset to dist
        run: mv ${{ matrix.asset }} dist/ 2>/dev/null || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Zimi-windows-x64-Setup
          path: dist/Zimi-windows-x64-Setup.exe

  release:
    needs: build
    # Tag pushes and explicit tag dispatches release; a bare dispatch (e.g.
    # validating a branch build) stops after the build jobs.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: macos-latest  # Need macOS for Sparkle sign_update tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # RELEASE_TOKEN is a fine-grained PAT that can push to main (bypasses branch protection)
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # The builds keep their short internal names; what people download is
      # named here, once: Zimi-<version>-<platform>-<chip>. Everything below
      # (the signatures, the appcasts, the cask, the release) reads release/.
      # The five builds must all be there; the snap may not be (its build is
      # allowed to fail, and one that will not open is never uploaded).
      - name: Name the files for the release
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          mkdir -p release
          cp Zimi-AppleSilicon/Zimi-AppleSilicon.dmg          "release/Zimi-$V-macOS-AppleSilicon.dmg"
          cp Zimi-Intel/Zimi-Intel.dmg                        "release/Zimi-$V-macOS-Intel.dmg"
          cp Zimi-windows-x64-Setup/Zimi-windows-x64-Setup.exe "release/Zimi-$V-Windows-x64-Setup.exe"
          cp Zimi-windows-x64/Zimi-windows-x64.zip            "release/Zimi-$V-Windows-x64.zip"
          cp Zimi-Linux-amd64/Zimi-Linux-amd64.AppImage       "release/Zimi-$V-Linux-x64.AppImage"
          for snap in Zimi-Linux-snap/*.snap; do
            if [ -e "$snap" ]; then cp "$snap" "release/Zimi-$V-Linux-x64.snap"; fi
          done
          echo "ZIMI_STEM=Zimi-$V" >> "$GITHUB_ENV"
          ls -la release

      # ── Sparkle/WinSparkle EdDSA signing + appcasts ─────────────────
      - name: Sign updates and update appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY not set, skipping update signing"
            exit 0
          fi

          # Download Sparkle tools. sign_update produces EdDSA (ed25519)
          # signatures that WinSparkle verifies too, so one keypair signs the
          # mac DMGs and the Windows installer alike.
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 "https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz" -o /tmp/sparkle.tar.xz
          tar -xf /tmp/sparkle.tar.xz -C /tmp

          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="epheterson/Zimi"

          # Sign one enclosure and write its appcast.
          #   $1 label  $2 file-to-sign  $3 release-asset  $4 outfile  $5 min-sys line
          #   $6 extra enclosure attributes (e.g. sparkle:installerArguments)
          generate_appcast() {
            local LABEL="$1" FILE="$2" ASSET="$3" OUTFILE="$4" MINSYS="$5" ENC_EXTRA="$6"
            if [ ! -f "$FILE" ]; then
              echo "WARNING: No $LABEL enclosure found at $FILE"
              return 1
            fi

            echo "Signing $FILE ($LABEL)..."
            local SIG=$(/tmp/bin/sign_update "$FILE" --ed-key-file <(echo "$SPARKLE_PRIVATE_KEY") 2>&1)
            local ED_SIG=$(echo "$SIG" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"//')
            local LENGTH=$(echo "$SIG" | grep -o 'length="[^"]*"' | sed 's/length="//;s/"//')

            if [ -z "$ED_SIG" ]; then
              echo "ERROR: Failed to sign $LABEL enclosure"
              return 1
            fi

            cat > "$OUTFILE" << APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Zimi Updates</title>
              <link>https://github.com/${REPO}</link>
              <description>Offline knowledge server for ZIM files</description>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>${MINSYS}
                <pubDate>$(date -R)</pubDate>
                <enclosure
                  url="https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
                  length="${LENGTH}"
                  type="application/octet-stream"
                  sparkle:edSignature="${ED_SIG}"${ENC_EXTRA}
                />
              </item>
            </channel>
          </rss>
          APPCAST
            sed -i '' 's/^          //' "$OUTFILE"
            echo "Generated $OUTFILE:"
            cat "$OUTFILE"
          }

          MAC_MINSYS=$'\n            <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>'
          generate_appcast "Intel" "release/$ZIMI_STEM-macOS-Intel.dmg" "$ZIMI_STEM-macOS-Intel.dmg" "appcast-intel.xml" "$MAC_MINSYS" ""
          generate_appcast "Apple Silicon" "release/$ZIMI_STEM-macOS-AppleSilicon.dmg" "$ZIMI_STEM-macOS-AppleSilicon.dmg" "appcast-arm64.xml" "$MAC_MINSYS" ""
          # Windows enclosure is the Inno Setup installer; WinSparkle (0.9.4)
          # downloads it, runs it with sparkle:installerArguments via
          # ShellExecuteEx, then quits WITHOUT relaunching — so /SILENT gives a
          # click-free progress-only update and the installer's [Run] entry does
          # the relaunch (windows/zimi.iss). /SP- skips the "ready to install"
          # prompt. Per-user install (no UAC), so silent is safe.
          WIN_INSTALLER_ARGS=' sparkle:installerArguments="/SILENT /SP-"'
          generate_appcast "Windows" "release/$ZIMI_STEM-Windows-x64-Setup.exe" "$ZIMI_STEM-Windows-x64-Setup.exe" "appcast-windows.xml" "" "$WIN_INSTALLER_ARGS"

          # Commit and push to main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast-intel.xml appcast-arm64.xml appcast-windows.xml
          git diff --cached --quiet && echo "No appcast changes" || {
            git commit -m "Update appcasts for ${TAG}"
            git push origin main
          }

      - name: Update Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping cask update"
            exit 0
          fi

          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"

          # Compute SHA256 for both DMGs
          SHA_ARM=$(shasum -a 256 "release/$ZIMI_STEM-macOS-AppleSilicon.dmg" | awk '{print $1}')
          SHA_INTEL=$(shasum -a 256 "release/$ZIMI_STEM-macOS-Intel.dmg" | awk '{print $1}')
          echo "Apple Silicon SHA256: $SHA_ARM"
          echo "Intel SHA256: $SHA_INTEL"

          # Clone the tap repo
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/epheterson/homebrew-zimi.git" /tmp/homebrew-zimi
          cd /tmp/homebrew-zimi

          # Generate updated cask
          cat > Casks/zimi.rb << CASK
          cask "zimi" do
            arch arm: "AppleSilicon", intel: "Intel"

            version "${VERSION}"
            sha256 arm:   "${SHA_ARM}",
                   intel: "${SHA_INTEL}"

            url "https://github.com/epheterson/Zimi/releases/download/v#{version}/Zimi-#{version}-macOS-#{arch}.dmg"
            name "Zimi"
            desc "Offline knowledge server for ZIM files"
            homepage "https://github.com/epheterson/Zimi"

            depends_on macos: ">= :ventura"

            app "Zimi.app"

            zap trash: [
              "~/.config/zimi",
              "~/Library/Preferences/com.epheterson.zimi.plist",
            ]
          end
          CASK
          sed -i '' 's/^          //' Casks/zimi.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/zimi.rb
          git diff --cached --quiet && echo "No cask changes" || {
            git commit -m "Update zimi to ${VERSION}"
            git push origin main
          }
          echo "Homebrew cask updated to ${VERSION}"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          # release/ holds exactly what ships: the five builds, and the snap
          # when it built and opened (checked when release/ was filled).
          fail_on_unmatched_files: true
          files: release/*
